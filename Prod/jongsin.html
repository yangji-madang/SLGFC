<!DOCTYPE html>
<html lang="ko" data-viewer="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>종신보험 5종 컨셉 비교</title>
<style>
:root{--navy:#1f3a5f;--gold:#b8892b;--line:#b9c3cf;--head:#dce9f5;--txt:#1b2430;--muted:#5d6b7a;--pz:1}
*{box-sizing:border-box}
html{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
body{margin:0;background:#eef1f5;color:var(--txt);font-size:14px;line-height:1.4;word-break:keep-all;overflow-wrap:break-word}
.page{max-width:1320px;margin:0 auto;background:#fff;padding:8px 14px 10px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid #98a6b6;background:#f7f9fb;border-radius:4px;padding:3px 9px}
button:hover{background:#e8eff7}
button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
button.pri:hover{background:#2c4f7e}
button.dg{color:#b3261e;border-color:#d9a5a1}
button.sm{padding:1px 6px;font-size:12px}
button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
button.gh{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
button.gh:hover{background:#9c7420}
input[type=text],input[type=number],select,textarea{border:1px solid #98a6b6;border-radius:4px;padding:3px 6px;background:#fff;min-width:0}
textarea{width:100%;line-height:1.35;resize:vertical}
.muted{color:var(--muted)}
.ok{color:#117a3a}.er{color:#b3261e}
/* 제목 */
.hd{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:3px}
.hd h1{margin:0;font-size:20px;color:var(--navy);white-space:nowrap}
.hd .sub{font-size:13px;font-weight:600}
.hd .ex{margin-left:auto;font-size:12px;font-weight:600;white-space:nowrap}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:5px 0}
.tb .sp{flex:1}
.tb label{display:inline-flex;gap:4px;align-items:center;white-space:nowrap;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid #98a6b6;border-radius:12px;padding:1px 9px;background:#fff;cursor:pointer;font-size:13px;user-select:none}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.sec{margin:6px 0;border:1px solid #cfd7e0;border-radius:5px;overflow:hidden}
.sec>h2{margin:0;padding:3px 10px;background:var(--navy);color:#fff;font-size:14px;display:flex;align-items:center;gap:8px}
.sec>h2 .no{background:var(--gold);color:#fff;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.sec>h2 small{font-weight:400;opacity:.85;margin-left:auto}
.sec .bd{padding:6px 8px}
/* 줄 표기 */
.ln{line-height:1.38;text-wrap:pretty}
.ln.b{font-weight:700}
.ln.mu{color:var(--muted);font-size:.88em}
.ln.wn{color:#b3261e;font-weight:700}
.ln.hl{color:#c4521f;font-weight:800}
/* 1. 컨셉 도식 */
.cgrid{display:grid;grid-template-columns:7.6em repeat(var(--n),minmax(0,1fr));gap:13px 6px;align-items:stretch}
.clab{grid-row:1/span var(--r);background:#eef3f9;border:1px solid #cfd7e0;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#23364d;padding:4px}
.clab b{font-size:1.15em}.clab small{margin-top:6px;color:var(--muted)}
.ch{background:var(--c);color:var(--tc);text-align:center;padding:6px 4px 7px;border-radius:6px 6px 0 0;margin-bottom:-7px;display:flex;flex-direction:column;justify-content:flex-start}
.ch .nm{font-size:1.18em;font-weight:800;line-height:1.2}
.ch .sb{font-size:.82em;opacity:.92}
.ch .sl{margin-top:3px;font-size:.92em}
.ch .tg{align-self:center;margin-top:5px;background:#fff;color:#3e2b20;border-radius:10px;padding:0 10px;font-size:.84em;font-weight:700}
.stp{background:color-mix(in srgb,var(--c) 13%,#fff);border:1px solid var(--c);padding:6px 4px;text-align:center;position:relative;border-radius:3px;display:flex;flex-direction:column;justify-content:flex-start}
.stp:not(.f)::before{content:'';position:absolute;left:50%;top:-11px;margin-left:-8px;border:8px solid transparent;border-top:9px solid var(--c);border-bottom:0}
/* 2. 비교표 */
table.cmp2{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
table.cmp2 th,table.cmp2 td{border:1px solid #e0d2bf;padding:5px 4px;vertical-align:middle}
table.cmp2 thead th{color:var(--tc);background:var(--c);text-align:center;font-size:1.1em}
table.cmp2 thead th.corner{background:#dce9f5;color:#23364d;border-color:#cfd7e0}
table.cmp2 thead th small{display:block;font-weight:400;font-size:.75em}
table.cmp2 th.rl{background:#eef3f9;color:#23364d;text-align:center;font-weight:700;line-height:1.25;border-color:#cfd7e0}
table.cmp2 td{text-align:center;background:#fff}
table.cmp2 tbody tr:nth-child(even) td{background:#fffdf8}
table.cmp2 tr.fsep th{background:#1f3a5f;color:#fff;text-align:left;padding:2px 8px;font-size:.9em}
.st{font-weight:800;line-height:1.3}
.st.ok{color:#c4521f}.st.x{color:#7b8794;font-weight:600}.st.na{color:#b4bcc6;font-weight:400}.st.chk{color:#b3261e}
td .sub{font-size:.88em;color:var(--muted)}
/* 3. 그래프 */
.cb{position:relative}
.cb svg{width:100%;height:auto;display:block;font-family:inherit}
.cb svg text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;justify-content:center;font-size:12.5px;margin-top:2px}
.legend .li{cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:0 4px;border-radius:3px;user-select:none}
.legend .li:hover{background:#eef3f9}.legend .li.off{opacity:.35}
.legend .li svg{width:24px;height:12px;flex:none}
.tip{display:none;position:absolute;top:8px;z-index:20;background:rgba(255,255,255,.97);border:1px solid #9fb0c3;border-radius:6px;padding:5px 8px;box-shadow:0 4px 14px rgba(20,40,70,.22);font-size:12.5px;pointer-events:none;max-width:330px}
.tip .th{font-weight:700;color:var(--navy);border-bottom:1px solid #dde3ea;margin-bottom:2px;padding-bottom:1px}
.tip .tr{display:flex;align-items:center;gap:6px;line-height:1.55}
.tip .tr i{width:10px;height:10px;border-radius:50%;flex:none}
.tip .tr span{flex:1;white-space:nowrap}
table.rt2{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;margin-top:6px}
table.rt2 th,table.rt2 td{border:1px solid #e0d2bf;padding:3px 2px;text-align:center;font-variant-numeric:tabular-nums}
table.rt2 thead th{background:#dce9f5;color:#23364d}
table.rt2 th.pn{color:var(--tc);background:var(--c);font-size:.95em;text-align:center}
table.rt2 td.hit{background:#fbe3d6;color:#c4521f;font-weight:800}
table.rt2 td.no{color:#b4bcc6}
/* 4. 연금 */
.pgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:8px}
.pcards{display:flex;flex-direction:column;gap:8px}
.pcard{border:1px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:3px;overflow:hidden;flex:1}
.pcard .pt{background:var(--c);color:var(--tc);padding:3px 8px;font-weight:700;font-size:.95em}
.pcard .pb{padding:5px 8px}
.pcard .pb .ln{padding:1px 0}
/* 5. 포인트 */
.pts{background:#f3e6cf;border:1px solid #e0d2bf;border-radius:4px;padding:6px 10px}
.pts .ptt{font-weight:800;color:#c4521f;margin-bottom:2px}
.pts .ln{position:relative;padding-left:12px}
.pts .ln::before{content:'•';position:absolute;left:0}
.nts{margin-top:5px;font-size:12px;color:#4d5b6a}
.nts .ln{padding-left:12px;position:relative}
.nts .ln::before{content:'※';position:absolute;left:0}
.laws{margin-top:3px;font-size:12px}
.laws a{color:#0b5cad}
/* 푸터 */
.pgft{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:6px;padding-top:3px;border-top:1px solid #cfd7e0}
.pgft .ct{font-size:12px;color:#34424f}
.pgft .cp{font-size:11.5px;margin-left:auto;text-align:right;white-space:nowrap;color:#34424f}
/* 관리 전용 */
.admin-only{display:none}
body.admin .admin-only{display:block}
html[data-viewer] .admin-only,html[data-viewer] .adm-btn{display:none!important}
.adm-btn{display:none}
.dh{cursor:grab;display:inline-block;padding:0 6px;font-size:15px;color:#5d6b7a;user-select:none}
.dh:active{cursor:grabbing}
.dragover{outline:2px dashed #c4521f;background:#fff1e6!important}
.chip[draggable=true]{cursor:grab}
body.admin .adm-btn{display:inline-block}
details.pnl{border:1px solid #d5dce4;border-radius:4px;margin:5px 0;background:#fafbfd}
details.pnl>summary{cursor:pointer;padding:4px 10px;font-weight:700;color:var(--navy);font-size:13.5px}
details.pnl>.in{padding:4px 10px 8px}
.row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:3px 0}
.mt{border-collapse:collapse;font-size:12.5px}
.mt th,.mt td{border:1px solid #cfd6de;padding:2px 4px;text-align:center;vertical-align:middle}
.mt th{background:var(--head);white-space:nowrap}
.mt td.l{text-align:left}
.mt input[type=text]{width:100%}
.mt input.y{width:58px;text-align:right}
.tnote{font-size:12px;color:var(--muted);margin:2px 0}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 10px}
.fg label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:1px}
.fg label input,.fg label select{color:var(--txt);font-size:13px;width:100%}
.blk{border:1px solid #d5dce4;border-radius:5px;padding:5px 8px;margin:6px 0;background:#fff}
.blk>b{color:var(--navy)}
body.fmt [data-sk]{cursor:pointer}
body.fmt [data-sk]:hover{outline:2px dashed #c4521f;outline-offset:1px}
body.fmt [data-sk].fsel{outline:2px solid #c4521f}
/* 모달 */
.modal{position:fixed;left:50%;top:4vh;transform:translateX(-50%);max-width:96vw;max-height:92vh;display:flex;flex-direction:column;background:#fff;border:1px solid #6c7f93;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.modal .mh{background:var(--navy);color:#fff;padding:5px 10px;display:flex;justify-content:space-between;align-items:center;cursor:move;border-radius:5px 5px 0 0;user-select:none;touch-action:none}
.modal .mh .x{background:transparent;color:#fff;border:none;font-size:16px;padding:0 4px}
.modal .mb{padding:8px 10px;overflow:auto}
.tabs{display:flex;gap:2px;margin:4px 0 0;flex-wrap:wrap}
.tabs button{border-radius:4px 4px 0 0;border-bottom:none}
/*GH-POS*/
@media screen{html:not([data-viewer]) body{padding-top:40px!important}#btnGh{position:fixed!important;top:6px!important;right:12px!important;left:auto!important;bottom:auto!important;z-index:99999!important;margin:0!important;font-size:13px}}
@media print{#btnGh{display:none!important}}
/*END-GH-POS*/
@page{size:A4 portrait;margin:8mm}
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{background:#fff;font-size:11px}
 .noprint,.modal,.admin-only,body.admin .admin-only{display:none!important}
 .page{max-width:none;padding:0}
 .pgwrap{zoom:var(--pz)}
 .sec{border:none;margin:3px 0;break-inside:avoid}
 .sec>h2{padding:1px 6px;font-size:11.5px}
 .sec .bd{padding:3px 0}
 .hd h1{font-size:17px}
 table.cmp2{font-size:10.5px}
 table.cmp2 th,table.cmp2 td{padding:3px 3px}
 table.rt2{font-size:10.5px}
 .pg2{break-before:page}
 .pts,.nts,.pcard{break-inside:avoid}
 tr{break-inside:avoid}
 .pgft .ct,.pgft .cp{font-size:9.5px}
}
</style>
</head>

/* --- 입력 처리 --- */
const getP = id => prod(id);
document.addEventListener('input', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  const P = t.dataset.id ? getP(t.dataset.id) : null, i = +t.dataset.i;
  switch (f) {
    case 'g': S[t.dataset.k] = t.type === 'number' ? num(t.value) : t.value; break;
    case 'sec': S.sec[t.dataset.k] = t.value; break;
    case 'ptxt': P[t.dataset.k] = t.value; break;
    case 'pcol': P.color = t.value; break;
    case 'pchk': P[t.dataset.k] = t.checked; break;
    case 'pslg': P.slogan = lines(t.value); break;
    case 'pstep': P.steps[+t.dataset.s] = lines(t.value); break;
    case 'prow': P.rows[t.dataset.r] = lines(t.value); break;
    case 'pfs': (P.func[t.dataset.fid] = P.func[t.dataset.fid] || { s: 'na', t: [] }).s = t.value; break;
    case 'pft': (P.func[t.dataset.fid] = P.func[t.dataset.fid] || { s: 'na', t: [] }).t = lines(t.value); break;
    case 'prate': { const v = num(t.value); P.rates = P.rates || {}; if (v === null) delete P.rates[t.dataset.y]; else P.rates[t.dataset.y] = v; break; }
    case 'rowdef': S.rows[i].label = t.value.replace(/ \/ /g, '\n'); break;
    case 'featdef': S.features[i].label = t.value.replace(/ \/ /g, '\n'); break;
    case 'lines': S[t.dataset.k] = lines(t.value); break;
    case 'law': S.laws[i][t.dataset.k] = t.value; break;
    case 'pen': S.pension[t.dataset.k] = t.type === 'number' ? num(t.value) : t.value; break;
    case 'pcat': S.pension.cats[+t.dataset.ci] = t.value; break;
    case 'pser': S.pension.series[+t.dataset.si][t.dataset.k] = t.value; break;
    case 'pval': { const x = S.pension.series[+t.dataset.si]; x.vals = x.vals || []; x.vals[+t.dataset.ci] = num(t.value); break; }
    case 'pcard': S.pension.cards[i][t.dataset.k] = t.value; break;
    case 'pcardl': S.pension.cards[i].lines = lines(t.value); break;
    case 'fmt': return;
    default: return;
  }
  commit(false);
  if (f === 'pcol' || f === 'ptxt' && ['name', 'sub', 'tag'].includes(t.dataset.k)) { /* 색·이름은 칩/그래프 범례 즉시 반영 (renderMain 완료) */ }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset.f === 'pchk') { commit(true); } if (t.id === 'impF') importFile(t.files[0]); if (t.dataset.f === 'pfs') commit(false); });
/* 엑셀 붙여넣기 (환급률 · 연금 표) */
document.addEventListener('paste', e => {
  const t = e.target; if (!t.dataset || !['prate', 'pval'].includes(t.dataset.f)) return;
  const txt = (e.clipboardData || window.clipboardData).getData('text'); if (!/[\t\n]/.test(txt)) return;
  e.preventDefault();
  const grid = txt.replace(/\r/g, '').replace(/\n$/, '').split('\n').map(r => r.split('\t'));
  const cells = $$(`input[data-f="${t.dataset.f}"]`, t.closest('table')), tbl = t.closest('table');
  const rowsEl = $$('tr', tbl).map(tr => $$(`input[data-f="${t.dataset.f}"]`, tr)).filter(a => a.length);
  const r0 = rowsEl.findIndex(a => a.includes(t)), c0 = rowsEl[r0].indexOf(t);
  grid.forEach((row, ri) => row.forEach((v, ci) => { const el = rowsEl[r0 + ri] && rowsEl[r0 + ri][c0 + ci]; if (!el) return; el.value = v.trim().replace('%', ''); el.dispatchEvent(new Event('input', { bubbles: true })); }));
});

/* 상품 보기순서: 끌어서 이동 (표 핸들 · 상단 칩) */
let dragIdx = null;
document.addEventListener('dragstart', e => { const h = e.target.closest('[data-drag],[data-cdrag]'); if (!h) return; dragIdx = +(h.dataset.drag ?? h.dataset.cdrag); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(dragIdx)); } catch (x) {} });
document.addEventListener('dragover', e => { if (dragIdx === null) return; const t = e.target.closest('[data-prow],[data-cdrag]'); if (!t) return; e.preventDefault(); $$('.dragover').forEach(x => x.classList.remove('dragover')); t.classList.add('dragover'); });
document.addEventListener('drop', e => { if (dragIdx === null) return; const t = e.target.closest('[data-prow],[data-cdrag]'); $$('.dragover').forEach(x => x.classList.remove('dragover')); if (!t) { dragIdx = null; return; } e.preventDefault(); const to = +(t.dataset.prow ?? t.dataset.cdrag), from = dragIdx; dragIdx = null; if (from === to) return; const [m] = S.products.splice(from, 1); S.products.splice(to, 0, m); commit(true); });
document.addEventListener('dragend', () => { dragIdx = null; $$('.dragover').forEach(x => x.classList.remove('dragover')); });
/* --- 버튼 처리 --- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, i = +b.dataset.i, d = +b.dataset.d;
  switch (a) {
    case 'padd': { const p = { id: uid(), name: '새 상품', sub: '', color: '#8a5a2b', slogan: [], tag: '', steps: [['**① 단계1', '내용'], ['**② 단계2', '내용'], ['**③ 단계3', '내용']], show: true, rateOn: true, rows: {}, func: {}, rates: {}, rateLabel: '새 상품' }; S.products.push(p); commit(true); editProd(p.id); return; }
    case 'pmv': move(S.products, i, d); commit(true); return;
    case 'pdel': { const p = getP(b.dataset.id); if (!confirm(`'${p.name}' 상품을 삭제합니다. (표시만 끄려면 상품 목록의 '표시' 체크를 해제하세요)`)) return; S.products = S.products.filter(x => x.id !== p.id); S.pension.cards = S.pension.cards.filter(c => c.pid !== p.id); commit(true); return; }
    case 'pedit': editProd(b.dataset.id); return;
    case 'radd': { const v = $('#newRow').value.trim(); if (!v) return alert('항목명을 입력하세요.'); S.rows.push({ id: 'r' + uid(), label: v }); commit(true); return; }
    case 'rmv': move(S.rows, i, d); commit(true); return;
    case 'rdel': if (!confirm(`'${S.rows[i].label.replace(/\n/g, ' ')}' 항목을 삭제합니다. 각 상품에 입력한 내용도 함께 사라집니다.`)) return; S.rows.splice(i, 1); commit(true); return;
    case 'fadd': { const v = $('#newFeat').value.trim(); if (!v) return alert('기능명을 입력하세요.'); S.features.push({ id: 'f' + uid(), label: v }); commit(true); return; }
    case 'fmv': move(S.features, i, d); commit(true); return;
    case 'fdel': if (!confirm(`'${S.features[i].label.replace(/\n/g, ' ')}' 기능을 삭제합니다.`)) return; S.features.splice(i, 1); commit(true); return;
    case 'yadd': { const y = num($('#newYear').value); if (!y || y < 1) return alert('경과년도를 숫자로 입력하세요.'); if (S.years.includes(y)) return alert('이미 있는 경과년도입니다.'); S.years.push(y); S.years.sort((p, q) => p - q); UI.open.rate = true; commit(true); return; }
    case 'ydel': { const y = +b.dataset.y; if (!confirm(`${y}년 열을 삭제합니다. 입력한 환급률도 사라집니다.`)) return; S.years = S.years.filter(v => v !== y); S.products.forEach(p => { delete (p.rates || {})[y]; }); UI.open.rate = true; commit(true); return; }
    case 'pcadd': S.pension.cats.push('새 항목'); S.pension.series.forEach(x => x.vals.push(null)); UI.open.pen = true; commit(true); return;
    case 'pcdel': { const ci = +b.dataset.ci; S.pension.cats.splice(ci, 1); S.pension.series.forEach(x => x.vals.splice(ci, 1)); UI.open.pen = true; commit(true); return; }
    case 'psadd': S.pension.series.push({ name: '새 계열', color: '#b8892b', vals: S.pension.cats.map(() => null) }); UI.open.pen = true; commit(true); return;
    case 'psdel': S.pension.series.splice(+b.dataset.si, 1); UI.open.pen = true; commit(true); return;
    case 'cadd': S.pension.cards.push({ id: uid(), pid: (S.products[0] || {}).id, title: '새 설명 카드', lines: ['**내용을 입력하세요'] }); UI.open.pen = true; commit(true); return;
    case 'cmv': move(S.pension.cards, i, d); UI.open.pen = true; commit(true); return;
    case 'cdel': S.pension.cards.splice(i, 1); UI.open.pen = true; commit(true); return;
    case 'ladd': S.laws.push({ t: '', u: 'https://www.law.go.kr/' }); UI.open.txt = true; commit(true); return;
    case 'ldel': S.laws.splice(i, 1); UI.open.txt = true; commit(true); return;
    case 'exp': { const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), u = URL.createObjectURL(blob), el = document.createElement('a'); el.href = u; el.download = DATAFILE; el.click(); URL.revokeObjectURL(u); return; }
    case 'imp': $('#impF').click(); return;
    case 'fmtreset': if (confirm('모든 글꼴서식(글꼴·크기·색상·굵기·밑줄)을 초기화합니다.')) { S.styles = {}; commit(false); } return;
    case 'reset': if (confirm('모든 입력을 지우고 기본 데이터로 되돌립니다. 계속할까요?')) { S = normalize(DEFAULT); S.savedAt = Date.now(); commit(true); } return;
  }
});
function importFile(f) {
  if (!f) return; const r = new FileReader();
  r.onload = () => { try { const o = JSON.parse(r.result); if (!o.products) throw 0; S = normalize(o); commit(true); alert('가져왔습니다.'); } catch (e) { alert('올바른 JSON 파일이 아닙니다.'); } $('#impF').value = ''; };
  r.readAsText(f);
}

      <div class="row"><label><input type="checkbox" data-f="pchk" data-id="${id}" data-k="show" ${p.show !== false ? 'checked' : ''}> 조회·인쇄에 표시</label><label><input type="checkbox" data-f="pchk" data-id="${id}" data-k="rateOn" ${p.rateOn !== false ? 'checked' : ''}> 환급률 그래프에 포함</label></div>`;
    if (tab === 'steps') b = HINT + (p.steps || []).map((st, k) => `<div class="blk"><div class="row"><b>단계 ${k + 1}</b><button class="sm dg" data-sdel="${k}">삭제</button></div><textarea rows="4" data-f="pstep" data-id="${id}" data-s="${k}">${esc(st.join('\n'))}</textarea></div>`).join('') + `<button class="sm pri" data-sadd>＋ 단계 추가</button>`;
    if (tab === 'rows') b = HINT + S.rows.map(r => `<div class="blk"><b>${esc(r.label.replace(/\n/g, ' '))}</b><textarea rows="5" data-f="prow" data-id="${id}" data-r="${r.id}">${esc(((p.rows || {})[r.id] || []).join('\n'))}</textarea></div>`).join('') || '<div class="muted">비교 항목이 없습니다. [비교 항목 · 기능 관리]에서 추가하세요.</div>';
    if (tab === 'func') b = S.features.map(f => { const v = (p.func || {})[f.id] || { s: 'na', t: [] }; return `<div class="blk"><div class="row"><b style="min-width:130px">${esc(f.label.replace(/\n/g, ' '))}</b><select data-f="pfs" data-id="${id}" data-fid="${f.id}">${Object.keys(KIND).map(k => `<option value="${k}" ${v.s === k ? 'selected' : ''}>${KIND[k]}</option>`).join('')}</select></div><textarea rows="2" data-f="pft" data-id="${id}" data-fid="${f.id}" placeholder="보조 문구(줄 단위, 선택)">${esc((v.t || []).join('\n'))}</textarea></div>`; }).join('') || '<div class="muted">기능 항목이 없습니다.</div>';
    if (tab === 'rate') b = `<div class="row"><label>예시 조건(표·범례) <input type="text" data-f="ptxt" data-id="${id}" data-k="rateLabel" value="${esc(p.rateLabel)}" style="width:260px"></label></div><div class="tnote">빈 칸 = 자료 없음. 엑셀 범위 붙여넣기 가능.</div><table class="mt"><tr>${S.years.map(y => `<th>${y}년</th>`).join('')}</tr><tr>${S.years.map(y => `<td><input type="text" class="y" data-f="prate" data-id="${id}" data-y="${y}" value="${(p.rates || {})[y] ?? ''}"></td>`).join('')}</tr></table>`;
    box.innerHTML = `<div class="tabs">${tabs.map(t => `<button class="${tab === t[0] ? 'on' : ''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div><div style="border:1px solid #98a6b6;padding:8px;border-radius:0 4px 4px 4px">${b}</div><div class="row" style="margin-top:6px"><span class="muted">입력은 즉시 저장·반영됩니다.</span><button class="sm" data-pclose style="margin-left:auto">닫기</button></div>`;
  };
  draw();
  box.addEventListener('click', e => {
    const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; draw(); return; }
    const sd = e.target.closest('[data-sdel]'); if (sd) { p.steps.splice(+sd.dataset.sdel, 1); commit(false); draw(); return; }
    if (e.target.closest('[data-sadd]')) { p.steps.push(['**새 단계', '내용']); commit(false); draw(); return; }
    if (e.target.closest('[data-pclose]')) { m.remove(); renderAdmin(); }
  });
  const m = openModal('상품 편집 — ' + p.name, box, 640);
  $('[data-close]', m).addEventListener('click', () => renderAdmin());
}

fmtDlg = function (el) {

  <div class="row"><label><input type="radio" name="fsc" value="one" checked> 이 글자만</label><label><input type="radio" name="fsc" value="grp"> 같은 종류 전체(예: 모든 상품명)</label></div>

  <label>굵기·밑줄<span><label style="display:inline-flex;flex-direction:row;gap:3px"><input type="checkbox" id="fB" ${(v.b === 1 || (v.b === undefined && parseInt(cs.fontWeight) >= 600)) ? 'checked' : ''}> 굵게</label> <label style="display:inline-flex;flex-direction:row;gap:3px"><input type="checkbox" id="fU" ${(v.u === 1 || (v.u === undefined && cs.textDecorationLine.includes('underline'))) ? 'checked' : ''}> 밑줄</label></span></label></div>
  <div class="row" style="margin-top:6px"><button class="sm dg" id="fRes">이 범위 초기화</button><button class="sm" id="fClose" style="margin-left:auto">닫기</button></div>`;
  const apply = (k, val) => { const o = cur(); o[k] = val; commit(false); const nel = $(`[data-sk="${CSS.escape(key)}"]`); if (nel) nel.classList.add('fsel'); };
  box.addEventListener('input', e => { const t = e.target; if (t.id === 'fFf') apply('ff', t.value || undefined); if (t.id === 'fFs') apply('fs', num(t.value) || undefined); if (t.id === 'fC') apply('c', t.value); });
  box.addEventListener('change', e => { const t = e.target; if (t.name === 'fsc') { scope = t.value; } if (t.id === 'fB') apply('b', t.checked ? 1 : 0); if (t.id === 'fU') apply('u', t.checked ? 1 : 0); });
  fmtModal = openModal('글꼴서식', box, 360); fmtModal.style.left = 'auto'; fmtModal.style.right = '16px'; fmtModal.style.transform = 'none'; fmtModal.style.top = '90px';
  $('#fClose', box).addEventListener('click', () => { fmtModal.remove(); fmtModal = null; $$('.fsel').forEach(x => x.classList.remove('fsel')); });
  $('#fRes', box).addEventListener('click', () => { if (scope === 'one') delete S.styles[key]; else delete S.styles['g:' + grp]; commit(false); fmtModal.remove(); fmtModal = null; });

function rgb2hex(c) { if (/^#/.test(c)) return c.length === 4 ? '#' + c.slice(1).replace(/./g, x => x + x) : c; const m = c.match(/\d+/g); if (!m) return '#000000'; return '#' + m.slice(0, 3).map(n => (+n).toString(16).padStart(2, '0')).join(''); }

/* --- GitHub 반영 --- */
function ghCfg() {
  let c = {}; try { c = JSON.parse(localStorage.getItem(GHK) || '{}'); } catch (e) {}
  if (!c.tok) { try { const o = JSON.parse(localStorage.getItem('refund_gh_cfg_v1') || '{}'); if (o.tok) c = { tok: o.tok, repo: o.repo, branch: o.branch }; } catch (e) {} }
  return { tok: c.tok || '', repo: c.repo || 'yangji-madang/SLGFC', path: c.path || 'Prod/' + DATAFILE, branch: c.branch || 'main' };
}
function ghSave(c) { try { localStorage.setItem(GHK, JSON.stringify(c)); } catch (e) { alert('이 브라우저에 저장하지 못했습니다.'); } }
const tokMask = t => t ? t.slice(0, 4) + '…' + t.slice(-4) + ' (' + t.length + '자)' : '저장된 토큰 없음';
function tokDlg() {
  const c = ghCfg(), box = document.createElement('div');
  box.innerHTML = `<div class="tnote">※ 토큰은 <b>이 브라우저(localStorage)에만</b> 저장되며 화면·파일·GitHub에는 기록되지 않습니다. 환급률 비교 페이지에서 이미 설정한 토큰이 있으면 자동으로 이어 씁니다.<br>※ 필요 권한: 대상 저장소 Contents <b>Read and write</b>.</div>
  <div class="fg"><label style="grid-column:1/-1">액세스 토큰 <input type="password" id="tkIn" autocomplete="off" placeholder="github_pat_… / ghp_…"></label><label>저장소(소유자/이름)<input type="text" id="tkRepo" value="${esc(c.repo)}"></label><label>브랜치<input type="text" id="tkBr" value="${esc(c.branch)}"></label><label style="grid-column:1/-1">저장 파일 경로<input type="text" id="tkPath" value="${esc(c.path)}"></label></div>
  <div class="row">현재 상태 : <b id="tkSt">${esc(tokMask(c.tok))}</b></div><div class="row" id="tkMsg" style="min-height:18px"></div>
  <div class="row"><button class="sm" id="tkSave">저장</button><button class="sm" id="tkDel">토큰 삭제</button><button class="sm" id="tkClose" style="margin-left:auto">닫기</button></div>`;
  const m = openModal('GitHub 토큰 설정', box, 480), q = id => $(id, box), msg = (t, ok) => { q('#tkMsg').style.color = ok ? '#17803d' : '#b3261e'; q('#tkMsg').textContent = t; };
  q('#tkSave').addEventListener('click', () => { const o = ghCfg(), n = { tok: q('#tkIn').value.trim() || o.tok, repo: q('#tkRepo').value.trim(), path: q('#tkPath').value.trim().replace(/^\/+/, ''), branch: q('#tkBr').value.trim() || 'main' };
    if (!n.tok) return msg('토큰을 입력해 주세요.'); if (/[^\x21-\x7e]/.test(n.tok)) return msg('토큰에 공백·한글 등 사용할 수 없는 문자가 있습니다.'); if (!/^[\w.-]+\/[\w.-]+$/.test(n.repo)) return msg('저장소는 "소유자/이름" 형식입니다.'); if (!n.path) return msg('저장 파일 경로를 입력하세요.');
    ghSave(n); q('#tkIn').value = ''; q('#tkSt').textContent = tokMask(n.tok); msg('저장했습니다.', true); });
  q('#tkDel').addEventListener('click', () => { const n = ghCfg(); n.tok = ''; ghSave(n); try { localStorage.removeItem('refund_gh_cfg_v1'); } catch (e) {} q('#tkSt').textContent = tokMask(''); msg('토큰을 삭제했습니다.', true); });
  q('#tkClose').addEventListener('click', () => m.remove());
}
async function ghPush() {
  const c = ghCfg(); if (!c.tok) { alert('GitHub 토큰이 설정되어 있지 않습니다. 토큰 설정 창을 엽니다.'); return tokDlg(); }
  const api = `https://api.github.com/repos/${c.repo}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`, hd = { Authorization: 'Bearer ' + c.tok, Accept: 'application/vnd.github+json' };
  try {
    let sha; const g = await fetch(api + '?ref=' + encodeURIComponent(c.branch), { headers: hd });
    if (g.ok) sha = (await g.json()).sha; else if (g.status === 401) { alert('토큰이 올바르지 않거나 만료되었습니다.'); return tokDlg(); } else if (g.status !== 404) return alert('GitHub 확인 실패: ' + g.status);
    S.savedAt = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    const body = { message: 'jongsin_data 갱신 ' + new Date().toISOString().slice(0, 10), content: btoa(unescape(encodeURIComponent(JSON.stringify(S, null, 1)))), branch: c.branch }; if (sha) body.sha = sha;
    const r = await fetch(api, { method: 'PUT', headers: hd, body: JSON.stringify(body) });
    alert(r.ok ? `GitHub(${c.repo}/${c.path})에 반영했습니다. 조회 페이지는 잠시 후 갱신됩니다.` : (r.status === 403 || r.status === 404 ? '반영 실패(' + r.status + '): 토큰의 저장소 쓰기(Contents) 권한을 확인해 주세요.' : '반영 실패: ' + r.status + ' ' + (await r.text()).slice(0, 200)));
  } catch (e) { alert('반영 실패: ' + e.message); }
}
$('#btnTok').addEventListener('click', tokDlg); $('#btnGh').addEventListener('click', ghPush);
