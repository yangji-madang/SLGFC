<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주요상품 환급률 비교 (관리)</title>
<style>
:root{--navy:#1f3a5f;--gold:#b8892b;--line:#b9c3cf;--head:#dce9f5;--txt:#1b2430;--muted:#5d6b7a;--blue:#0000ff}
*{box-sizing:border-box}
html{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
body{margin:0;background:#eef1f5;color:var(--txt);font-size:14px;line-height:1.4;word-break:keep-all;overflow-wrap:break-word}
.page{max-width:1320px;margin:0 auto;background:#fff;padding:8px 14px 10px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid #98a6b6;background:#f7f9fb;border-radius:4px;padding:3px 9px}
button:hover{background:#e8eff7}
button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
button.pri:hover{background:#2c4f7e}
button.dg{color:#b3261e;border-color:#d9a5a1}
button.sm{padding:1px 6px;font-size:12px}
input[type=text],input[type=number],select,textarea{border:1px solid #98a6b6;border-radius:4px;padding:3px 6px;background:#fff;min-width:0}
input[type=number]{text-align:right}
.muted{color:var(--muted)}
/* 제목 */
.hd{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:3px}
.hd h1{margin:0;font-size:20px;color:var(--navy);white-space:nowrap}
.hd .sub{font-size:13px;font-weight:600}
.hd .ex{margin-left:auto;font-size:12px;font-weight:600;white-space:nowrap}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:5px 0}
.tb .sp{flex:1}
.tb label{display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.nav a{margin-right:10px;color:var(--navy);font-weight:600;text-decoration:none;font-size:13px}
/* 섹션 */
.sec{margin:6px 0;border:1px solid #cfd7e0;border-radius:5px;overflow:hidden}
.sec>h2{margin:0;padding:3px 10px;background:var(--navy);color:#fff;font-size:14px;display:flex;align-items:center;gap:8px}
.sec>h2 .no{background:var(--gold);color:#fff;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.sec>h2 small{font-weight:400;opacity:.85;margin-left:auto}
.sec .bd{padding:6px 8px}
.row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:3px 0}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid #98a6b6;border-radius:12px;padding:1px 9px;background:#fff;cursor:pointer;font-size:13px;user-select:none}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.ft{background:#fbf3df;border-color:#d9bd7a;color:#6b4e0f;cursor:default;font-size:12px;padding:0 7px}
.chip .x{cursor:pointer;opacity:.7;margin-left:2px}
.tag{display:inline-block;background:#fbf3df;border:1px solid #e0c98c;color:#6b4e0f;border-radius:8px;padding:0 6px;font-size:11px;margin:0 2px 1px 0}
details.pn{border:1px solid #d5dce4;border-radius:4px;margin:5px 0;background:#fafbfd}
details.pn>summary{cursor:pointer;padding:3px 8px;font-weight:700;color:var(--navy);font-size:13px}
details.pn>.in{padding:4px 8px 6px}
.tabs{display:flex;gap:2px;margin:4px 0 0}
.tabs button{border-radius:4px 4px 0 0;border-bottom:none}
.tabs button.on{background:var(--navy);color:#fff}
/* 마스터 목록 */
.mt{width:100%;border-collapse:collapse;font-size:12.5px}
.mt th,.mt td{border:1px solid #cfd6de;padding:2px 4px;text-align:center;vertical-align:middle}
.mt th{background:var(--head);white-space:nowrap}
.mt td.l{text-align:left}
.mt input[type=number]{width:96px}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle}
/* 요약 */
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 14px}
.qa{border-left:3px solid var(--gold);padding:1px 0 1px 8px;break-inside:avoid}
.qa .q{font-weight:700;color:var(--navy);font-size:13.5px}
.qa .a .s{display:block;font-size:13px;text-wrap:pretty}
.memo{margin-top:4px;padding:3px 8px;background:#f6f8fb;border:1px dashed #b9c3cf;border-radius:4px}
/* 표 */
.tw{overflow:auto;max-height:74vh}
table.rt{table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:var(--fs,13px);border-top:1px solid var(--line);border-left:1px solid var(--line)}
table.rt th,table.rt td{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:var(--ch,2px) 6px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.rt thead th{position:sticky;z-index:4;overflow:hidden;text-overflow:ellipsis}
table.rt thead th.lc,table.rt thead th.cn{z-index:6}
table.rt thead th.cn{left:0}
table.rt td.nm,table.rt td.ft,table.rt td.ty,table.rt td.pl,table.rt td.it{position:sticky;z-index:2;background:#fff;overflow:hidden;text-overflow:ellipsis}
table.rt td.ft{white-space:normal;text-align:left;line-height:1.25;font-size:.92em}
table.rt td.ft .tag{margin:1px 2px 1px 0}
.rzc{position:absolute;top:0;right:-3px;width:8px;height:100%;cursor:col-resize;z-index:8;touch-action:none}
.rzr{position:absolute;left:0;bottom:-3px;height:8px;width:100%;cursor:row-resize;z-index:8;touch-action:none}
.rzc:hover,.rzr:hover{background:rgba(31,58,95,.28)}
.sgrp{display:flex;gap:5px 7px;flex-wrap:wrap;align-items:center;margin:4px 0;padding:3px 7px;border:1px solid #e1e6ec;border-radius:5px;background:#fafbfd}
.sgrp b{min-width:58px;color:var(--navy)}
.sgrp .chips{display:contents}
.cb{position:relative}
.tip{display:none;position:absolute;top:8px;z-index:20;background:rgba(255,255,255,.97);border:1px solid #9fb0c3;border-radius:6px;padding:5px 8px;box-shadow:0 4px 14px rgba(20,40,70,.22);font-size:12.5px;pointer-events:none;max-width:330px}
.tip .th{font-weight:700;color:var(--navy);border-bottom:1px solid #dde3ea;margin-bottom:2px;padding-bottom:1px}
.tip .tr{display:flex;align-items:center;gap:6px;line-height:1.55}
.tip .tr i{width:10px;height:10px;border-radius:50%;flex:none}
.tip .tr span{flex:1;white-space:nowrap}
.cb svg .sr{transition:opacity .2s}
.cb svg.hl .sr{opacity:.13}
.cb svg.hl .sr.on{opacity:1}
.cb svg .fade{opacity:0;animation:fi .7s ease 1.7s forwards}
@keyframes fi{to{opacity:1}}
.legend .li.on{background:#eef3f9}
.adm-btn{display:none}
body.admin .adm-btn{display:inline-block}
html[data-viewer] .adm-btn{display:none!important}
button.gh{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
button.gh:hover{background:#9c7420}
.pbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pf{border-radius:16px;padding:4px 14px;font-weight:700;border:1px solid var(--navy);background:#fff;color:var(--navy)}
.pf.on{background:var(--navy);color:#fff}
.notice{font-size:12.5px;font-weight:700;color:#b23a2c;margin:3px 0 0;text-wrap:pretty}
.sizebar{font-size:12px;color:var(--muted)}
.sizebar input[type=range]{width:90px;vertical-align:middle}
table.rt thead th{background:var(--head);text-align:center;font-weight:600}
table.rt thead tr.fl th{background:#fff;border:none!important;color:#d40000;font-size:12px;padding:0 2px;font-weight:700}
table.rt td.nm,table.rt td.ty,table.rt td.pl,table.rt td.mo,table.rt td.it{text-align:center}
table.rt td.nm{font-weight:700}
table.rt td.it{color:var(--muted);font-size:12px}
table.rt tr.v1 td.vv{color:var(--blue)}
table.rt td.pl.v1{background:#fff2c6}
table.rt td.hl{background:#ffff00;font-weight:700}
table.rt td.fc,table.rt th.fc{border-left:2px solid #e00000;border-right:2px solid #e00000}
table.rt th.fc.top{border-top:2px solid #e00000}
table.rt td.fc.bot{border-bottom:2px solid #e00000}
table.rt tr.bk td{background:#f1f6fb}
table.rt tr.grp-first td{border-top:1.5px solid #6c7f93}
table.rt tr td.hl{background:#ffff00!important}
table.rt tr.flash td{outline:2px solid var(--gold);outline-offset:-2px}
.tnote{font-size:12px;color:var(--muted);margin:2px 0}
/* 그래프 */
.cb svg{width:100%;height:auto;display:block}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px 10px;font-size:12px;margin-top:2px}
.legend .li{cursor:pointer;display:flex;align-items:center;gap:5px}
.legend .li:hover{background:#eef3f9}
.basis{font-size:11.5px;color:#34424f;margin-top:4px;line-height:1.45}
.basis a{color:#0b5cad}
.basis .s{display:block;text-wrap:pretty}
/* 푸터 */
.ft{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:6px;padding-top:3px;border-top:1px solid #cfd7e0}
.ft .ct{font-size:12px;color:#34424f}
.ft .cp{font-size:11.5px;margin-left:auto;text-align:right;white-space:nowrap;color:#34424f}
/* 모달 */
.modal{position:fixed;left:50%;top:4vh;transform:translateX(-50%);max-width:96vw;max-height:92vh;display:flex;flex-direction:column;background:#fff;border:1px solid #6c7f93;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.modal .mh{background:var(--navy);color:#fff;padding:5px 10px;display:flex;justify-content:space-between;align-items:center;cursor:move;border-radius:5px 5px 0 0;user-select:none;touch-action:none}
.modal .mh .x{background:transparent;color:#fff;border:none;font-size:16px;padding:0 4px}
.modal .mb{padding:8px 10px;overflow:auto}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px}
.fg label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:1px}
.fg label input,.fg label select{color:var(--txt);font-size:13px;width:100%}
.pg{border-collapse:collapse;margin-top:4px;font-size:12.5px}
.pg th,.pg td{border:1px solid #cfd6de;padding:1px 3px;text-align:center}
.pg th{background:var(--head)}
.pg input{width:116px}
.pg input.rt{width:80px}
.ok{color:#117a3a}.er{color:#b3261e}
/* 인쇄 */
.admin-only{display:none}
body.admin .admin-only{display:block}
html[data-viewer] .admin-only,html[data-viewer] .admin-link,html[data-viewer] #btnMode{display:none!important}
@page{size:A4 landscape;margin:8mm}
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{background:#fff;font-size:11px}
 .noprint,.modal{display:none!important}
 .admin-only,body.admin .admin-only{display:none!important}
 .page{max-width:none;padding:0}
 .sec{border:none;margin:3px 0}
 .sec>h2{padding:1px 6px;font-size:11px}
 .sec .bd{padding:3px 0}
 .hd h1{font-size:17px}
 table.rt{font-size:10px}
 table.rt th,table.rt td{padding:1px 4px}
 .qa .a .s,.qa .q{font-size:10px}
 .cb svg{max-height:150mm}
 .rzc,.rzr,.tip{display:none!important}
 table.rt{width:100%!important}
 .sumgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
 .sec.chart{break-before:page}
 .legend{font-size:10px;grid-template-columns:repeat(5,1fr)}
 .basis{font-size:9px}
 .tw{overflow:visible;max-height:none!important}
 tr{break-inside:avoid}
 .sec.chart{break-inside:avoid}
 .ft .ct,.ft .cp{font-size:9.5px}
}
/*GH-POS*/
@media screen{html body{padding-top:40px!important}#btnGh{position:fixed!important;top:6px!important;right:12px!important;left:auto!important;bottom:auto!important;z-index:99999!important;margin:0!important;font-size:13px!important;padding:6px 14px!important;border-radius:4px!important;background:#b8860b!important;border:1px solid #8a6508!important;color:#fff!important;font-weight:700!important;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3)}}
@media print{#btnGh{display:none!important}}
/*END-GH-POS*/</style>
</head>
<body>
<div class="page">

<header class="hd">
  <h1>■ 주요상품 환급률 비교</h1>
  <span class="sub" id="subTitle"></span>
  <span class="ex" id="exLabel"></span>
</header>

<div class="notice" id="notice"></div>
<div class="tb noprint">
  <span class="pbar" id="pbar"></span><span class="sp"></span>
  <button data-act="rates">🏦 은행 적금금리표</button>
  <button class="pri" id="prt" data-act="print">🖨 인쇄</button>
  <button data-act="mode" id="btnMode">⚙ 관리모드</button>
  <button class="gh adm-btn" data-act="gh" id="btnGh">⬆ GitHub 반영</button>
</div>

<!-- 1. 검색 -->
<section class="sec noprint" id="sec-search">
  <h2><span class="no">1</span>검색 <small id="srCount"></small></h2>
  <div class="bd">
    <div class="row">
      <input type="text" id="srQ" placeholder="상품명·유형·메모 검색 (공백=AND)" style="width:260px">
      <label><input type="checkbox" id="srDisc"> 단종 상품 포함</label>
      <button data-act="srClear">전체 초기화</button>
    </div>
    <div class="sgrp"><b>핵심기능</b>
      <select id="srMode"><option value="OR">하나라도 포함(OR)</option><option value="AND">모두 포함(AND)</option></select>
      <button class="sm" data-act="srFeatAll">전체선택</button><button class="sm" data-act="srFeatNone">선택해제</button>
      <span class="chips" id="srFeats"></span>
      <span class="muted" style="font-size:12px">※ 선택 없음 = 조건 없음</span></div>
    <div class="sgrp"><b>상품</b>
      <button class="sm" data-act="srProdAll">전체선택</button><button class="sm" data-act="srProdNone">전체해제</button>
      <span class="chips" id="srProds"></span>
      <span class="muted" style="font-size:12px">※ 중복 선택 가능 · 선택한 상품만 표·그래프에 표시</span></div>
  </div>
</section>

<!-- 2. MasterDB -->
<section class="sec noprint admin-only" id="sec-master">
  <h2><span class="no">2</span>Master DB 입력·관리 <small>※ 입력값은 이 브라우저에 자동 저장 · 공유는 'GitHub 반영' 또는 JSON 내보내기</small></h2>
  <div class="bd" id="masterBody"></div>
</section>

<!-- 3. 요약 -->
<section class="sec" id="sec-summary">
  <h2><span class="no">3</span>요약 리뷰 <small id="sumBasis"></small></h2>
  <div class="bd"><div id="sumBody"></div></div>
</section>

<!-- 4. 표 -->
<section class="sec tbl" id="sec-table">
  <h2><span class="no">4</span>환급률 표 <small id="tblUnit"></small></h2>
  <div class="bd">
    <div class="row noprint" id="tblOpt"></div>
    <div class="row noprint sizebar">셀 크기
      <label>기본 열 너비 <input type="range" min="34" max="140" data-pref="cw"></label>
      <label>행 높이 <input type="range" min="0" max="12" data-pref="ch"></label>
      <label>글자 <input type="range" min="10" max="18" data-pref="fs"></label>
      <button class="sm" data-act="prefReset">개별 조정 초기화</button>
      <span>· 머리글 경계선(열)과 구분/항목 칸 아래 경계선(행)을 드래그하면 칸별로 조절, 더블클릭하면 초기화 · 상품 열과 나이 행은 고정됩니다.</span></div>
    <div class="tw" id="tblBody"></div>
    <div class="tnote" id="tblNote"></div>
  </div>
</section>

<!-- 5. 그래프 -->
<section class="sec chart" id="sec-chart">
  <h2><span class="no">5</span>경과기간별 환급률 · 은행 비교 <small>범례 클릭 시 해당 상품 숨김/표시</small></h2>
  <div class="bd">
    <div class="row noprint" id="chOpt"></div>
    <div class="cb"><div id="chBody"></div><div class="tip" id="chTip"></div></div>
    <div class="legend" id="chLegend"></div>
    <div class="basis" id="basis"></div>
  </div>
</section>

<footer class="ft">
  <div class="ct"><span data-ct></span></div>
  <div class="cp" id="ftCopy"></div>
</footer>
</div>

<script>

'use strict';
/* ===== 유틸 ===== */
const VIEWER = document.documentElement.dataset.viewer === '1';
const KEY = 'refund_master_v1', MODEKEY = 'refund_mode_v1';
const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === null || v === undefined || v === '') return null; const n = Number(String(v).replace(/,/g, '')); return Number.isFinite(n) ? n : null; };

const clone = o => JSON.parse(JSON.stringify(o));

const uniq = a => [...new Set(a)];
const fmt1 = v => v.toFixed(1);
const man = v => Math.round(v / 10000).toLocaleString('ko-KR');
const fmtAmt = v => { if (v >= 10000) { const e = Math.floor(v / 10000), r = v % 10000; return e + '억' + (r ? ' ' + r.toLocaleString('ko-KR') + '만' : ''); } return v.toLocaleString('ko-KR') + '만원'; };
const PALETTE = ['#1c2cf0','#e8212b','#f2b705','#12a150','#111111','#0b73c9','#7b2fa8','#e8731a','#0e9aa7','#a3478f','#6b8e23','#8b5a2b'];

const DEF_PERIODS = [3, 6, 12, 36, 60, 84, 120, 180, 240, 300, 360];

    ['행복', '2형 체증형', 5, '', [31.3, 98.0, 104.5, 119.1, 125.9, 132.9, 140.1, 146.9, 153.1]],

/* ===== 셀 크기 (전체 기본값 + 개별 드래그) ===== */
const PKEY = 'refund_view_prefs', PDEF = { cw: 64, ch: 2, fs: 13 };
let PREF = Object.assign({ cols: {}, rows: {} }, PDEF);
try { const o = JSON.parse(localStorage.getItem(PKEY) || '{}'); Object.assign(PREF, o); } catch (e) {}
PREF.cols = PREF.cols || {}; PREF.rows = PREF.rows || {};
const savePref = () => { try { localStorage.setItem(PKEY, JSON.stringify(PREF)); } catch (e) {} };
function syncPref() { $$('[data-pref]').forEach(el => { el.value = PREF[el.dataset.pref]; }); }
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.pref; if (!k) return; PREF[k] = +e.target.value; savePref(); renderTable(curT()); });

/* ===== 바인딩 ===== */
function getPath(path) { if (path === 'settings.focus0') return S.settings.focus[0]; if (path === 'settings.focus1') return S.settings.focus[1]; return path.split('.').reduce((o, k) => o[k], S); }
function setPath(path, v) {
  if (path === 'settings.focus0') { S.settings.focus[0] = +v; return; } if (path === 'settings.focus1') { S.settings.focus[1] = +v; return; }
  const ks = path.split('.'), last = ks.pop(); const o = ks.reduce((o, k) => o[k], S); o[last] = v;
}
function syncBind() {
  $$('[data-set]').forEach(el => {
    const v = getPath(el.dataset.set);
    if (el.type === 'checkbox') el.checked = !!v; else if (document.activeElement !== el) el.value = v ?? '';
  });
}
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.pf) {
    const [pid, f] = el.dataset.pf.split('|'), pf = S.profiles.find(x => x.id === pid); if (!pf) return;
    let v = el.type === 'number' ? num(el.value) : el.value.trim();
    if (f === 'label' && !v) v = pf.label; pf[f] = v; if (pid === S.curPid && f in S.defaults) S.defaults[f] = v;
    commit(); return;
  }
  if (el.dataset.set) {
    let v = el.type === 'checkbox' ? el.checked : (el.type === 'number' ? num(el.value) : el.value);
    if (el.dataset.set === 'settings.bankCalc' || el.dataset.set === 'settings.labelMode' || el.tagName === 'SELECT' && el.dataset.set.startsWith('settings.focus')) v = el.value;
    setPath(el.dataset.set, v); commit(); return;
  }
  if (el.id === 'srMode') { SR.mode = el.value; renderAll(); return; }
  if (el.id === 'srDisc') { SR.disc = el.checked; renderAll(); return; }
  const a = el.dataset.act; if (!a) return;
  const p = S.products.find(x => x.id === el.dataset.id);
  if (a === 'pon' && p) { p.on = el.checked; commit(); }
  else if (a === 'pv' && p) { p[el.dataset.k] = el.checked; commit(); }
  else if (a === 'mon' && p) { p.monthly = num(el.value); commit(); }
  else if (a === 'bv') { const b = S.banks.find(x => x.id === el.dataset.id); if (b) { b.show = el.checked; commit(); } }
  else if (a === 'sel') { el.checked ? UI.sel.add(el.dataset.id) : UI.sel.delete(el.dataset.id); }
  else if (a === 'selAll') { const l = S.products.filter(x => (UI.tab === 'active') === x.active); l.forEach(x => el.checked ? UI.sel.add(x.id) : UI.sel.delete(x.id)); renderMaster(); }
});
$('#srQ').addEventListener('input', e => { SR.q = e.target.value; renderAll(); $('#srQ').focus(); });

/* ===== 클릭 액션 ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.tagName === 'INPUT') return;
  const a = t.dataset.act, id = t.dataset.id, v = t.dataset.v;
  const idx = S.products.findIndex(x => x.id === id), p = S.products[idx];
  switch (a) {
    case 'print': window.print(); break;
    case 'pfSel': switchProfile(id); break;
    case 'pfAdd': { snapCur(); const pf = { id: uid(), code: '', label: '새 프로필', age: 40, sex: '남', amount: S.defaults.amount, pay: S.defaults.pay, notice: DEFNOTICE, snap: {}, bsnap: {} }; S.profiles.push(pf); applyProf(S, pf.id); CH.first = true; commit(); break; }
    case 'pfDup': { snapCur(); const c = clone(curProf()); c.id = uid(); c.label += ' (복사)'; c.code = ''; S.profiles.push(c); applyProf(S, c.id); commit(); break; }
    case 'pfDel': if (S.profiles.length < 2) { alert('프로필은 최소 1개가 필요합니다.'); break; } if (confirm(`'${curProf().label}' 프로필과 입력 데이터를 삭제할까요? (복구 불가)`)) { const i = S.profiles.findIndex(x => x.id === S.curPid); S.profiles.splice(i, 1); applyProf(S, S.profiles[0].id); commit(); } break;
    case 'prefReset': PREF = Object.assign({ cols: {}, rows: {} }, PDEF); savePref(); syncPref(); renderTable(curT()); break;
    case 'replay': renderChart(true); break;
    case 'mode': { const on = !document.body.classList.contains('admin'); setMode(on); break; }
    case 'rates': openRates(null); break;
    case 'srClear': SR.q = ''; SR.feats.clear(); SR.excl.clear(); SR.disc = false; $('#srQ').value = ''; $('#srDisc').checked = false; renderAll(); break;
    case 'srFeat': SR.feats.has(v) ? SR.feats.delete(v) : SR.feats.add(v); renderAll(); break;
    case 'srFeatAll': S.features.forEach(f => SR.feats.add(f)); renderAll(); break;
    case 'srFeatNone': SR.feats.clear(); renderAll(); break;
    case 'srProd': SR.excl.has(id) ? SR.excl.delete(id) : SR.excl.add(id); renderAll(); break;
    case 'srProdAll': SR.excl.clear(); renderAll(); break;
    case 'srProdNone': S.products.filter(p => p.active || SR.disc).forEach(p => SR.excl.add(p.id)); renderAll(); break;
    case 'legend': if (t.dataset.kind === 'p') { const q = S.products.find(x => x.id === id); if (q) q.showG = false; } else { const b = S.banks.find(x => x.id === id); if (b) b.show = false; } commit(); break;
    case 'tab': UI.tab = v; renderMaster(); break;
    case 'pAdd': editProduct(null); break;
    case 'pEdit': editProduct(id); break;
    case 'pCopy': { const c = clone(p); c.id = uid(); c.label = c.label || ''; c.name = p.name; S.products.splice(idx + 1, 0, c); commit(); editProduct(c.id); break; }
    case 'pDisc': p.active = !p.active; commit(); break;
    case 'pDel': if (confirm(`'${shortOf(p)}' 상품을 삭제할까요? (복구 불가)`)) { S.products.splice(idx, 1); S.banks.forEach(b => { if (b.link === id) b.link = ''; }); commit(); } break;
    case 'up': case 'dn': { const dir = a === 'up' ? -1 : 1; let j = idx + dir; while (j >= 0 && j < S.products.length && S.products[j].active !== p.active) j += dir; if (j >= 0 && j < S.products.length) { [S.products[idx], S.products[j]] = [S.products[j], S.products[idx]]; commit(); } break; }
    case 'vis': S.products.filter(x => x.active).forEach(x => x[t.dataset.k] = v === '1'); commit(); break;
    case 'bulkSel': case 'bulkAll': bulk(a === 'bulkAll'); break;

  hd.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; drag = true; const r = m.getBoundingClientRect(); m.style.transform = 'none'; m.style.left = r.left + 'px'; m.style.top = r.top + 'px'; sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; hd.setPointerCapture(e.pointerId); });

  S.profiles.forEach(pf => S.products.forEach(p => { const sn = pf.snap[p.id]; if (!sn) return; S.periods.forEach(m => { const d = sn.data[m]; if (!d) return; rows.push([pf.label, p.name, p.type, p.pay ?? '', p.label, pf.age, pf.sex, pf.amount, sn.monthly ?? '', p.features.join(';'), plabel(m), d.paid ?? '', d.refund ?? '', d.rate ?? '']); }); }));

}
function parseCsv(t) {
  t = t.replace(/^﻿/, ''); const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(cur); cur = ''; } else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; } else if (c !== '\r') cur += c; }

}
function loadSheetJS() { return new Promise((res, rej) => { if (window.XLSX) return res(); const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload = res; s.onerror = () => rej(new Error('엑셀 라이브러리 로드 실패(인터넷 연결 확인). CSV로 저장 후 업로드하세요.')); document.head.append(s); }); }
async function handleUpload(file) {

    else { await loadSheetJS(); const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' }); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: true }); }

const normH = h => String(h ?? '').replace(/\s|\(.*?\)|（.*?）/g, '');
function parsePeriod(v) { if (typeof v === 'number') return Math.round(v * 12); const s = String(v).trim(); let m; if ((m = s.match(/^(\d+(?:\.\d+)?)\s*개월$/))) return Math.round(+m[1]); if ((m = s.match(/^(\d+(?:\.\d+)?)\s*년?$/))) return Math.round(+m[1] * 12); return null; }
function importCore(hdr, body, skipDemo) {
  const col = n => hdr.indexOf(n);
  const ci = { name: col('상품명'), type: col('유형'), pay: col('납입기간'), label: col('구분'), age: col('가입나이'), sex: col('성별'), amt: col('가입금액'), mon: col('월보험료'), feat: col('핵심기능'), per: col('경과기간'), paid: col('누적보험료'), refund: Math.max(col('환급액'), col('환급금')), rate: col('환급률') };
  if (ci.name < 0) throw new Error("'상품명' 열을 찾을 수 없습니다.");
  const wide = hdr.map((h, i) => ({ i, m: parsePeriod(h) })).filter(x => x.m && !Object.values(ci).includes(x.i) && /^\d/.test(hdr[x.i]));
  let added = 0, upd = 0, cells = 0;
  const find = (name, type, pay, label) => S.products.find(p => p.name === name && p.type === type && (label ? p.label === label : String(p.pay ?? '') === String(pay ?? '')));

    if (!p) { p = { id: uid(), bpay: pay, blabel: label, on: true, name, type, label, pay, age: null, sex: '', amount: null, monthly: null, features: [], active: true, showT: true, showG: true, note: '', data: {} }; S.products.push(p); added++; touched.add(p.id); }
    else if (!touched.has(p.id)) { upd++; touched.add(p.id); }
    if (!skipDemo) {
      if (ci.age >= 0 && num(g(ci.age)) !== null) p.age = num(g(ci.age));
      if (ci.sex >= 0 && ['남', '여'].includes(String(g(ci.sex)).trim())) p.sex = String(g(ci.sex)).trim();
      if (ci.amt >= 0 && num(g(ci.amt)) !== null) p.amount = num(g(ci.amt));
    }
    p.on = true;
    if (ci.mon >= 0 && num(g(ci.mon)) !== null) p.monthly = num(g(ci.mon));
    if (ci.feat >= 0 && String(g(ci.feat)).trim()) { const fs = String(g(ci.feat)).split(/[;,/、]/).map(x => x.trim()).filter(Boolean); fs.forEach(f => { if (!S.features.includes(f)) S.features.push(f); }); p.features = uniq([...p.features, ...fs]); }

      const m = parsePeriod(g(ci.per)); if (m) { addPeriod(m); const d = p.data[m] = p.data[m] || {}; [['paid', ci.paid], ['refund', ci.refund], ['rate', ci.rate]].forEach(([k, i]) => { const v = i >= 0 ? num(g(i)) : null; if (v !== null) { d[k] = v; cells++; } }); }
    }
    wide.forEach(w => { const v = num(r[w.i]); if (v !== null) { addPeriod(w.m); (p.data[w.m] = p.data[w.m] || {}).rate = v; cells++; } });
  });
  return { added, upd, cells };
}
function importRows(rows) {
  rows = rows.filter(r => r.some(c => String(c ?? '').trim() !== '')); if (rows.length < 2) throw new Error('데이터 행이 없습니다.');
  const hdr = rows[0].map(normH), body = rows.slice(1), pc = hdr.indexOf('프로필');
  if (pc < 0) { const r = importCore(hdr, body, false); return `업로드 완료(현재 프로필 '${curProf().label}'): 신규 ${r.added}개 · 갱신 ${r.upd}개 상품, 입력값 ${r.cells}건`; }
  const groups = new Map(); body.forEach(r => { const k = String(r[pc] ?? '').trim() || curProf().label; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
  snapCur(); const orig = S.curPid; let a = 0, u = 0, c = 0, created = 0;
  groups.forEach((rs, label) => {
    let pf = S.profiles.find(x => x.label === label);
    if (!pf) {
      const g = n => { const i = hdr.indexOf(n); return i >= 0 ? rs[0][i] : ''; };
      const sx = String(g('성별')).trim();
      pf = { id: uid(), code: '', label, age: num(g('가입나이')) ?? S.defaults.age, sex: ['남', '여'].includes(sx) ? sx : S.defaults.sex, amount: num(g('가입금액')) ?? S.defaults.amount, pay: S.defaults.pay, notice: DEFNOTICE, snap: {}, bsnap: {} };
      S.profiles.push(pf); created++;
    }
    snapCur(); applyProf(S, pf.id);
    const r = importCore(hdr, rs, true); a += r.added; u += r.upd; c += r.cells;
  });
  snapCur(); applyProf(S, orig);
  return `업로드 완료: 프로필 ${groups.size}개(신규 ${created}개) · 상품 신규 ${a}개/갱신 ${u}개 · 입력값 ${c}건`;
}

async function ghPush() {
