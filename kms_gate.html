<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Yoon's KMS</title>
<style>
  :root{
    --text:#10243a;
    --navy:#0f3358;
    --chip-text:#0d2b4a;
    --bg-pos:center center;          /* 세로 화면(휴대폰·태블릿 세로): 사진 전체 높이가 보임 */
  }
  @media (orientation:landscape){
    :root{ --bg-pos:center 62%; }    /* 가로 화면(컴퓨터 등): 하늘·산·나무가 함께 보이는 위치 */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    min-height:100dvh;
    background:#35597f;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    font-size:12px;
    line-height:1.35;
  }

  /* ===== 배경: 사진 원본 그대로 (흐림·색 변경 없음) =====
     사진을 바꾸려면 같은 이름(kms_bg.jpg)으로 파일만 교체하면 됩니다. */
  .bg{
    position:fixed;
    top:0;right:0;bottom:0;left:0;
    z-index:0;
    pointer-events:none;
    background:#35597f url("kms_bg.jpg") var(--bg-pos) / cover no-repeat;
  }

  /* ===== 화면 구성 ===== */
  .page{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    max-width:760px;
    margin:0 auto;
    padding:14px 14px 12px;
  }

  /* 구역 묶음: 이 영역 뒤에만 가장자리가 번지는 그라데이션을 깝니다 */
  .top{
    position:relative;
    z-index:0;
    align-self:flex-start;
    max-width:100%;
  }
  .top::before{
    content:"";
    position:absolute;
    top:-20px;right:-28px;bottom:-20px;left:-28px;
    z-index:-1;
    border-radius:34px;
    background:
      radial-gradient(90% 80% at 12% 8%, rgba(5,28,62,0.80) 0%, rgba(5,28,62,0) 72%),
      linear-gradient(160deg, rgba(8,38,78,0.70) 0%, rgba(8,38,78,0.50) 55%, rgba(8,38,78,0.24) 100%);
    filter:blur(20px);
  }
  @media (max-width:560px){
    .top::before{ left:-14px; right:-14px; }
  }

  /* ----- 구역: 모두 가장 넓은 박스에 맞춰 항상 같은 가로폭 ----- */
  main{
    display:grid;
    grid-template-columns:fit-content(100%);
    justify-content:start;
    row-gap:7px;
  }
  .panel{
    display:block;
    margin:0;
    padding:4px 7px 6px;
    background:rgba(234,244,255,0.70);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.55);
    border-radius:6px;
    box-shadow:0 2px 10px rgba(6,30,60,0.22);
  }
  .section h2{
    margin:0 0 4px;
    font-size:15.2px;
    font-weight:800;
    letter-spacing:-0.2px;
    color:var(--navy);
  }
  .links{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
  }
  a.link{
    display:inline-block;
    padding:3px 8px;
    border:1px solid #6f8db0;
    border-bottom-color:#3f648d;
    border-radius:5px;
    background:linear-gradient(180deg,#ffffff 0%,#e9f1fa 52%,#c9d9ec 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.95),
               inset 0 -1px 0 rgba(30,70,120,0.18),
               0 1px 0 #3f648d,
               0 3px 5px rgba(8,36,70,0.35);
    color:var(--chip-text);
    font-size:11.6px;
    font-weight:700;
    text-decoration:none;
    text-shadow:0 1px 0 rgba(255,255,255,0.8);
    white-space:nowrap;
    transition:transform .08s ease, box-shadow .08s ease, background .12s ease;
  }
  a.link:hover,a.link:focus{
    background:linear-gradient(180deg,#2a6aa6 0%,#1a4f86 55%,#123c68 100%);
    border-color:#0f3358;
    color:#ffffff;
    text-shadow:0 -1px 0 rgba(0,0,0,0.35);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.28),
               0 1px 0 #0b2a4b,
               0 3px 6px rgba(8,36,70,0.45);
    outline:none;
  }
  a.link:active{
    transform:translateY(1px);
    box-shadow:inset 0 2px 3px rgba(0,0,0,0.35),
               0 0 0 #0b2a4b;
  }

  /* ----- 하단 안내문: 배경색 상자 없이, 글자 뒤에만 번지는 그라데이션 ----- */
  .foot{
    position:relative;
    z-index:0;
    align-self:flex-start;
    max-width:100%;
    margin-top:auto;
    padding-top:14px;
  }
  .foot::before{
    content:"";
    position:absolute;
    top:4px;right:-24px;bottom:-12px;left:-24px;
    z-index:-1;
    border-radius:28px;
    background:rgba(4,20,14,0.64);
    filter:blur(14px);
  }
  @media (max-width:560px){
    .foot::before{ left:-14px; right:-14px; }
  }
  .foot .notice{
    margin:0 0 2px;
    font-size:11.2px;
    font-weight:800;
    color:#ffffff;
    text-shadow:0 1px 3px rgba(0,0,0,0.70);
    word-break:keep-all;
    text-wrap:balance;
  }
  .foot .copyright{
    margin:0;
    font-size:9.2px;
    color:#eef3ee;
    text-shadow:0 1px 3px rgba(0,0,0,0.70);
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<div class="page">
  <div class="top">
    <main id="gate"></main>
  </div>
  <noscript>자바스크립트를 켜야 메뉴가 표시됩니다.</noscript>

  <footer class="foot">
    <p class="notice">※ 고객상담시에는 반드시 시스템을 확인하시기 바랍니다.</p>
    <p class="copyright">ⓒ2026. YOON HYUNCHUL ALL RIGHTS RESERVED.</p>
  </footer>
</div>

<script>
/* ===== 업데이트는 이 목록만 고치면 됩니다 =====
   - 구역 추가 : { title: "구역명", links: [ ... ] } 한 덩어리를 추가
   - 링크 추가 : links 안에 { label: "표시 이름", url: "주소" } 한 줄을 추가
   - 순서는 아래 나열 순서 그대로 화면에 표시됩니다.
   - 같은 저장소 안의 페이지는 "Prod/파일명.html" 처럼 짧게 적어도 됩니다. */
const MENU = [
  {
    title: "계약기본정보",
    links: [
      { label: "상품가입나이",       url: "Prod/Prod_Age.html" },
      { label: "간편보험 비교표",    url: "Prod/simple_goji.html" },
      { label: "간편보험 인수기준",  url: "Prod/simple_insu_2610.html" }
    ]
  },
  {
    title: "상품정보",
    links: [
      { label: "New플러스원 고환급특약 검색", url: "Prod/newplus1_surrendervalue.html" }
    ]
  },
  {
    title: "교육/강의",
    links: [
      { label: "CRETOP",                  url: "https://www.cretop.com" },
      { label: "런인베스트",              url: "https://www.learninvest.co.kr/u/samsunglife_gfc/login" },
      { label: "CO파트너",                url: "https://copartner.kr/co-report" },
      { label: "법인컨설팅AI",            url: "https://cc.learninvest.co.kr/" },
      { label: "삼성생명 Business Live ON", url: "https://www.samsung2030blo.com/" }
    ]
  }
];

const root = document.getElementById("gate");
MENU.forEach(function(sec){
  const box = document.createElement("section");
  box.className = "panel section";

  const h = document.createElement("h2");
  h.textContent = sec.title;
  box.appendChild(h);

  const row = document.createElement("div");
  row.className = "links";
  sec.links.forEach(function(item){
    const a = document.createElement("a");
    a.className = "link";
    a.href = item.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = item.label;
    row.appendChild(a);
  });
  box.appendChild(row);

  root.appendChild(box);
});
</script>
</body>
</html>
