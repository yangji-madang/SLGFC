<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Yoon's KMS</title>
<style>
  :root{
    --text:#10243a;
    --navy:#0f3358;
    --chip-text:#0d2b4a;
    --bg-pos:center center;          /* 세로 화면(휴대폰·태블릿 세로): 사진 전체 높이가 보임 */
  }
  @media (orientation:landscape){
    :root{ --bg-pos:center 62%; }    /* 가로 화면(컴퓨터 등): 하늘·산·나무가 함께 보이는 위치 */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    min-height:100dvh;
    background:#35597f;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    font-size:12px;
    line-height:1.35;
  }

  /* ===== 배경: 사진 원본 그대로 (흐림·색 변경 없음) =====
     사진을 바꾸려면 같은 이름(kms_bg.jpg)으로 파일만 교체하면 됩니다. */
  .bg{
    position:fixed;
    top:0;right:0;bottom:0;left:0;
    z-index:0;
    pointer-events:none;
    background:#35597f url("kms_bg.jpg") var(--bg-pos) / cover no-repeat;
  }

  /* ===== 화면 구성 ===== */
  .page{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    max-width:760px;
    margin:0 auto;
    padding:14px 14px 12px;
  }

  /* 구역 묶음: 이 영역 뒤에만 가장자리가 번지는 그라데이션을 깝니다 */
  .top{
    position:relative;
    z-index:0;
    align-self:flex-start;
    max-width:100%;
  }
  .top::before{
    content:"";
    position:absolute;
    top:-20px;right:-28px;bottom:-20px;left:-28px;
    z-index:-1;
    border-radius:34px;
    background:
      radial-gradient(90% 80% at 12% 8%, rgba(5,28,62,0.80) 0%, rgba(5,28,62,0) 72%),
      linear-gradient(160deg, rgba(8,38,78,0.70) 0%, rgba(8,38,78,0.50) 55%, rgba(8,38,78,0.24) 100%);
    filter:blur(20px);
  }
  @media (max-width:560px){
    .top::before{ left:-14px; right:-14px; }
  }

  /* ----- 구역: 모두 가장 넓은 박스에 맞춰 항상 같은 가로폭 ----- */
  main{
    display:grid;
    grid-template-columns:fit-content(100%);
    justify-content:start;
    row-gap:7px;
    max-width:100%;
  }
  .panel{
    display:block;
    margin:0;
    padding:4px 7px 6px;
    background:linear-gradient(180deg,rgba(226,241,255,0.92) 0%,rgba(200,226,252,0.88) 50%,rgba(174,208,246,0.86) 100%);
    -webkit-backdrop-filter:blur(2px);
    backdrop-filter:blur(2px);
    border:1px solid #1f4f86;
    border-top-color:#f2f9ff;
    border-radius:6px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),
               inset 0 -2px 0 rgba(60,90,130,0.22),
               0 2px 0 #1a4476,
               0 6px 11px rgba(3,18,45,0.55);
  }
  .section h2{
    margin:0 0 4px;
    font-size:15.2px;
    font-weight:800;
    letter-spacing:-0.2px;
    color:#071d3a;
    -webkit-text-stroke:0.4px #071d3a;
    text-shadow:none;
  }
  .links{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
  }
  a.link{
    display:inline-block;
    padding:3px 8px;
    border:1px solid #3a0a18;
    border-radius:5px;
    background:linear-gradient(180deg,rgba(255,255,255,0.30) 0%,rgba(255,255,255,0.08) 48%,rgba(255,255,255,0) 52%),
               linear-gradient(115deg,#c0566f 0%,#8c2c47 38%,#611a2f 70%,#3f0f1e 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.38),
               inset 0 -1px 0 rgba(0,0,0,0.25),
               0 1px 0 #3a0a18,
               0 3px 5px rgba(50,8,22,0.45);
    color:#ffffff;
    font-size:11.6px;
    font-weight:700;
    text-decoration:none;
    text-shadow:0 1px 1px rgba(0,0,0,0.45);
    white-space:nowrap;
    transition:transform .08s ease, box-shadow .08s ease, background .12s ease;
  }
  a.link:hover,a.link:focus{
    background:linear-gradient(180deg,#2f6aa3 0%,#1a4f86 55%,#123c68 100%);
    border-color:#0b2744;
    color:#ffffff;
    text-shadow:0 1px 1px rgba(0,0,0,0.45);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.3),
               0 1px 0 #0b2744,
               0 3px 6px rgba(6,28,56,0.45);
    outline:none;
  }
  a.link:active{
    transform:translateY(1px);
    box-shadow:inset 0 2px 3px rgba(0,0,0,0.35),
               0 0 0 #0b2744;
  }

  /* ----- 검색 영역 ----- */
  .search{ display:grid; gap:3px; padding-top:3px; padding-bottom:4px; }
  .search .kw{
    width:100%;
    min-width:0;
    font:inherit;
    font-size:16px;
    line-height:1.2;
    padding:3px 9px;
    color:#071d3a;
    background:rgba(255,255,255,0.92);
    border:1px solid #6f87a3;
    border-radius:5px;
    box-shadow:inset 0 2px 3px rgba(10,30,60,0.22),0 1px 0 rgba(255,255,255,0.9);
    outline:none;
    -webkit-appearance:none;
    appearance:none;
  }
  .search .kw::placeholder{ color:#5b6f86; }
  .search .kw:focus{ border-color:#74223a; box-shadow:inset 0 2px 3px rgba(10,30,60,0.22),0 0 0 2px rgba(116,34,58,0.35); }
  .search .pick{ display:flex; flex-wrap:wrap; gap:3px 8px; align-items:center; }
  .search label{ display:flex; align-items:center; gap:4px; font-size:11.6px; font-weight:800; color:#0b2547; }
  .search select{
    font:inherit;
    font-size:11.6px;
    font-weight:700;
    line-height:1.2;
    padding:1px 4px;
    max-width:170px;
    color:#071d3a;
    background:linear-gradient(180deg,#ffffff 0%,#dfe9f4 100%);
    border:1px solid #6f87a3;
    border-bottom-color:#3f648d;
    border-radius:5px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.95),0 1px 0 #3f648d,0 2px 4px rgba(8,36,70,0.28);
    outline:none;
  }
  .search select:focus{ border-color:#74223a; }
  .search button.reset{
    font:inherit;
    font-size:11.6px;
    font-weight:700;
    padding:1px 8px;
    color:#fff;
    background:linear-gradient(115deg,#8c2c47 0%,#611a2f 70%,#3f0f1e 100%);
    border:1px solid #3a0a18;
    border-radius:5px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.3),0 1px 0 #3a0a18,0 2px 4px rgba(50,8,22,0.4);
    text-shadow:0 1px 1px rgba(0,0,0,0.45);
    cursor:pointer;
  }
  .search button.reset:active{ transform:translateY(1px); box-shadow:inset 0 2px 3px rgba(0,0,0,0.35); }
  .search .count{ margin-left:auto; font-size:11.6px; font-weight:700; color:#0b2547; }
  .empty{ margin:0; font-size:13px; font-weight:700; color:#0b2547; }
  .hide{ display:none !important; }

  /* ----- 하위 항목(sub): 소제목 + 버튼 묶음 ----- */
  .sub{
    margin:5px 0 0;
    padding-top:5px;
    border-top:1px solid rgba(95,125,160,0.38);
  }
  .sub:first-of-type{ margin-top:2px; }
  .sub h3{
    display:inline-block;
    margin:0 0 4px;
    padding:1px 7px 1px 6px;
    font-size:12.5px;
    font-weight:800;
    letter-spacing:-0.1px;
    color:#0b2547;
    background:linear-gradient(180deg,#fffdf0 0%,#fff0b8 55%,#ffe38a 100%);
    border:1px solid #c9a23c;
    border-left:4px solid #74223a;
    border-radius:4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.95),0 1px 0 #a98524,0 2px 3px rgba(60,40,5,0.28);
  }

  /* ----- 하단 안내문: 배경색 상자 없이, 글자 뒤에만 번지는 그라데이션 ----- */
  .foot{
    position:relative;
    z-index:0;
    align-self:flex-start;
    max-width:100%;
    margin-top:auto;
    padding-top:14px;
  }
  .foot::before{
    content:"";
    position:absolute;
    top:4px;right:-24px;bottom:-12px;left:-24px;
    z-index:-1;
    border-radius:28px;
    background:rgba(4,20,14,0.64);
    filter:blur(14px);
  }
  @media (max-width:560px){
    .foot::before{ left:-14px; right:-14px; }
  }
  .foot .notice{
    margin:0 0 2px;
    font-size:11.6px;
    font-weight:800;
    color:#ffffff;
    text-shadow:0 1px 3px rgba(0,0,0,0.70);
    word-break:keep-all;
    text-wrap:balance;
  }
  .foot .copyright{
    margin:0;
    font-size:11.6px;
    color:#eef3ee;
    text-shadow:0 1px 3px rgba(0,0,0,0.70);
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<div class="page">
  <div class="top">
    <main id="gate"></main>
  </div>
  <noscript>자바스크립트를 켜야 메뉴가 표시됩니다.</noscript>

  <footer class="foot">
    <p class="notice">※ 고객상담시에는 반드시 시스템을 확인하시기 바랍니다.</p>
    <p class="copyright">ⓒ2026. YOON HYUNCHUL ALL RIGHTS RESERVED.</p>
  </footer>
</div>

<script>
/* ===== 업데이트는 이 목록만 고치면 됩니다 =====
   - 구역 추가 : { title: "구역명", links: [ ... ] } 한 덩어리를 추가
   - 하위 항목이 있는 구역 : { title: "구역명", sort: true, groups: [ { title: "소제목", links: [ ... ] } ] }
   - 링크 추가 : links 안에 { label: "표시 이름", url: "주소" } 한 줄을 추가
   - sort: true 인 구역은 소제목·링크가 화면에서 항상 가나다순으로 자동 정렬됩니다(입력 순서와 무관).
   - sort 가 없는 구역은 아래 나열 순서 그대로 표시됩니다.
   - 같은 저장소 안의 페이지는 "Prod/파일명.html" 처럼 짧게 적어도 됩니다. */
const MENU = [
  {
    title: "SLI GFC",
    groups: [
      { title: "계약기본정보", links: [
        { label: "상품가입나이",       url: "Prod/Prod_Age.html" },
        { label: "간편보험 비교표",    url: "Prod/simple_goji.html" },
        { label: "간편보험 인수기준",  url: "Prod/simple_insu_2610.html" }
      ]},
      { title: "상품정보", links: [
        { label: "New플러스원 고환급특약 검색", url: "Prod/newplus1_surrendervalue.html" }
      ]},
      { title: "교육/강의", links: [
        { label: "CRETOP",                  url: "https://www.cretop.com" },
        { label: "런인베스트",              url: "https://www.learninvest.co.kr/u/samsunglife_gfc/login" },
        { label: "CO파트너",                url: "https://copartner.kr/co-report" },
        { label: "법인컨설팅AI",            url: "https://cc.learninvest.co.kr/" },
        { label: "삼성생명 Business Live ON", url: "https://www.samsung2030blo.com/" }
      ]}
    ]
  },
  {
    title: "기관/협회",
    sort: true,
    groups: [
      { title: "고용.산업안전", links: [
        { label: "고용노동부",     url: "https://moel.go.kr" },
        { label: "중대재해알림e",  url: "https://labor.moel.go.kr/sasttc/main/main.do" },
        { label: "산업안전포털",   url: "https://portal.kosha.or.kr/" }
      ]},
      { title: "세제.법령", links: [
        { label: "국세청",             url: "https://www.nts.go.kr/" },
        { label: "국세법령정보시스템", url: "https://taxlaw.nts.go.kr" },
        { label: "국가법령정보센터",   url: "https://www.law.go.kr/" },
        { label: "재정경제부",         url: "https://www.moef.go.kr/" },
        { label: "조세심판원",         url: "https://www.tt.go.kr/" }
      ]},
      { title: "기업", links: [
        { label: "중소벤처24",     url: "https://portal.smes.go.kr" },
        { label: "기술보증기금",   url: "https://www.kibo.or.kr/" },
        { label: "대한상공회의소", url: "https://www.korcham.net/" },
        { label: "신용보증기금",   url: "https://www.kodit.or.kr/" },
        { label: "중소벤처기업부", url: "https://www.mss.go.kr/" },
        { label: "전자공시",       url: "https://dart.fss.or.kr/" },
        { label: "인터넷등기소",   url: "https://www.iros.go.kr" },
        { label: "중소기업중앙회", url: "https://www.kbiz.or.kr/ko/index/index.do" }
      ]},
      { title: "보험.금융", links: [
        { label: "금융감독원",             url: "https://www.fss.or.kr/" },
        { label: "금융소비자정보포털 파인", url: "https://fine.fss.or.kr/" },
        { label: "보험개발원",             url: "https://www.kidi.or.kr/" },
        { label: "보험다모아",             url: "https://www.e-insmarket.or.kr/" },
        { label: "생명보험협회",           url: "https://www.klia.or.kr/" },
        { label: "손해보험협회",           url: "https://www.knia.or.kr/" }
      ]},
      { title: "정보(통계/지표/건강 등)", links: [
        { label: "국가통계포털",          url: "https://kosis.kr/index/index.do" },
        { label: "국가데이터처",          url: "https://mods.go.kr" },
        { label: "지역사회건강조사",      url: "https://chs.kdca.go.kr/chs/index.do" },
        { label: "지표누리",              url: "https://index.go.kr/" },
        { label: "경제교육정보센터(KDI)", url: "https://eiec.kdi.re.kr/" },
        { label: "국가건강정보포털",      url: "https://health.kdca.go.kr/healthinfo/" },
        { label: "국가암정보센터",        url: "https://www.cancer.go.kr/" },
        { label: "질병분류정보센터",      url: "https://www.koicd.kr/main.do" }
      ]}
    ]
  }
];

const ko = function(a, b){ return a.localeCompare(b, "ko"); };
const norm = function(t){ return String(t).toLowerCase().replace(/\s+/g, ""); };

function buildLinks(list, store){
  const row = document.createElement("div");
  row.className = "links";
  list.forEach(function(item){
    const a = document.createElement("a");
    a.className = "link";
    a.href = item.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = item.label;
    row.appendChild(a);
    store.push({ el: a, label: item.label });
  });
  return row;
}

/* ----- 화면 만들기 ----- */
const root = document.getElementById("gate");
const model = [];   /* 검색에 쓰는 구조: 구역 > 소제목 > 링크 */

MENU.forEach(function(sec){
  const box = document.createElement("section");
  box.className = "panel section";
  const h = document.createElement("h2");
  h.textContent = sec.title;
  box.appendChild(h);

  const secModel = { title: sec.title, box: box, subs: [] };

  if (sec.groups) {
    const groups = sec.groups.slice();
    if (sec.sort) groups.sort(function(x, y){ return ko(x.title, y.title); });
    groups.forEach(function(g){
      const links = g.links.slice();
      if (sec.sort) links.sort(function(x, y){ return ko(x.label, y.label); });
      const sub = document.createElement("div");
      sub.className = "sub";
      const h3 = document.createElement("h3");
      h3.textContent = g.title;
      sub.appendChild(h3);
      const store = [];
      sub.appendChild(buildLinks(links, store));
      box.appendChild(sub);
      secModel.subs.push({ title: g.title, el: sub, links: store });
    });
  } else {
    const store = [];
    box.appendChild(buildLinks(sec.links, store));
    secModel.subs.push({ title: null, el: null, links: store });
  }
  model.push(secModel);
});

/* ----- 검색 영역 (맨 위) ----- */
const sp = document.createElement("section");
sp.className = "panel search";
sp.innerHTML =
  '<input id="kw" class="kw" type="search" placeholder="키워드 검색 (예: 국세, 안전, 공시)" autocomplete="off" aria-label="키워드 검색">' +
  '<div class="pick">' +
    '<label>대분류 <select id="s1" aria-label="대분류"></select></label>' +
    '<label>중분류 <select id="s2" aria-label="중분류"></select></label>' +
    '<button id="rs" class="reset" type="button">초기화</button>' +
    '<span id="cnt" class="count"></span>' +
  '</div>';
root.appendChild(sp);
model.forEach(function(m){ root.appendChild(m.box); });

const empty = document.createElement("p");
empty.className = "panel empty hide";
empty.textContent = "검색 결과가 없습니다.";
root.appendChild(empty);

const kw = document.getElementById("kw");
const s1 = document.getElementById("s1");
const s2 = document.getElementById("s2");
const cnt = document.getElementById("cnt");

function opt(v, t){ const o = document.createElement("option"); o.value = v; o.textContent = t; return o; }

/* 첫번째 항목: 구역 목록 */
s1.appendChild(opt("", "전체"));
model.forEach(function(m, i){ s1.appendChild(opt(String(i), m.title)); });

/* 중분류: 대분류를 고르면 그 하위항목만, 고르지 않으면 모든 중분류(소제목)를 보여줌.
   값은 "구역번호|하위번호" 형식. 소제목이 없는 구역은 링크 이름을 하위항목으로 사용. */
function fillS2(){
  const prev = s2.value;
  s2.innerHTML = "";
  s2.appendChild(opt("", "전체"));
  model.forEach(function(m, mi){
    if (s1.value !== "" && Number(s1.value) !== mi) return;
    if (m.subs[0].title !== null) {
      m.subs.forEach(function(sub, si){ s2.appendChild(opt(mi + "|" + si, sub.title)); });
    } else if (s1.value !== "") {
      m.subs[0].links.forEach(function(l, li){ s2.appendChild(opt(mi + "|" + li, l.label)); });
    }
  });
  const ok = Array.prototype.some.call(s2.options, function(o){ return o.value === prev; });
  s2.value = ok ? prev : "";
}

/* ----- 필터 적용 ----- */
function apply(){
  const q = norm(kw.value);
  const a = s1.value;
  const bp = s2.value === "" ? null : s2.value.split("|").map(Number);   /* [구역, 하위] */
  let shown = 0;

  model.forEach(function(m, mi){
    let secVisible = 0;
    const secOk = (a === "" || Number(a) === mi) && (bp === null || bp[0] === mi);

    m.subs.forEach(function(sub, si){
      let subOk = secOk;
      if (subOk && bp !== null && sub.title !== null) subOk = (bp[1] === si);
      let subVisible = 0;
      sub.links.forEach(function(l, li){
        let ok = subOk;
        if (ok && bp !== null && sub.title === null) ok = (bp[1] === li);
        if (ok && q !== "") ok = norm(l.label).indexOf(q) >= 0;   /* 키워드는 링크 이름만 검색 (대분류·중분류 이름은 제외) */
        l.el.classList.toggle("hide", !ok);
        if (ok) subVisible++;
      });
      if (sub.el) sub.el.classList.toggle("hide", subVisible === 0);
      secVisible += subVisible;
    });

    m.box.classList.toggle("hide", secVisible === 0);
    shown += secVisible;
  });

  empty.classList.toggle("hide", shown !== 0);
  cnt.textContent = shown + "개";
}

kw.addEventListener("input", apply);
s1.addEventListener("change", function(){ fillS2(); apply(); });
s2.addEventListener("change", apply);
document.getElementById("rs").addEventListener("click", function(){
  kw.value = ""; s1.value = ""; fillS2(); s2.value = ""; apply();
});

function lockWidth(){
  root.style.width = "";
  root.style.width = root.offsetWidth + "px";
}
fillS2();
apply();
lockWidth();
window.addEventListener("resize", function(){ lockWidth(); });
</script>
