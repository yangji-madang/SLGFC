<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Yoon's KMS</title>
<style>
  :root{
    --text:#10243a;
    --navy:#0f3358;
    --chip-text:#0d2b4a;
    --bg-pos:center center;          /* 세로 화면(휴대폰·태블릿 세로): 사진 전체 높이가 보임 */
  }
  @media (orientation:landscape){
    :root{ --bg-pos:center var(--bg-y,62%); }    /* 가로 화면(컴퓨터 등): 하늘·산·나무가 함께 보이는 위치 */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    min-height:100dvh;
    background:#35597f;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    font-size:12px;
    line-height:1.35;
  }

  /* ===== 배경: 사진 원본 그대로 (흐림·색 변경 없음) =====
     사진을 바꾸려면 같은 이름(kms_bg.jpg)으로 파일만 교체하면 됩니다. */
  .bg{
    position:fixed;
    top:0;right:0;bottom:0;left:0;
    z-index:0;
    pointer-events:none;
    background:#35597f var(--bg-img,url("kms_bg.jpg")) var(--bg-pos) / cover no-repeat;
  }

  /* ===== 화면 구성 ===== */
  .page{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    max-width:760px;
    margin:0 auto;
    padding:14px 14px 12px;
  }

  /* 구역 묶음: 이 영역 뒤에만 가장자리가 번지는 그라데이션을 깝니다 */
  .top{
    position:relative;
    z-index:0;
    align-self:flex-start;
    max-width:100%;
  }
  .top::before{
    content:"";
    position:absolute;
    top:-20px;right:-28px;bottom:-20px;left:-28px;
    z-index:-1;
    border-radius:34px;
    background:
      radial-gradient(90% 80% at 12% 8%, rgba(5,28,62,0.80) 0%, rgba(5,28,62,0) 72%),
      linear-gradient(160deg, rgba(8,38,78,0.70) 0%, rgba(8,38,78,0.50) 55%, rgba(8,38,78,0.24) 100%);
    filter:blur(20px);
  }
  @media (max-width:560px){
    .top::before{ left:-14px; right:-14px; }
  }

  /* ----- 구역: 모두 가장 넓은 박스에 맞춰 항상 같은 가로폭 ----- */
  main{
    display:grid;
    grid-template-columns:fit-content(100%);
    justify-content:start;
    row-gap:7px;
    max-width:100%;
  }
  .panel{
    display:block;
    margin:0;
    padding:4px 7px 6px;
    background:linear-gradient(180deg,rgba(226,241,255,0.92) 0%,rgba(200,226,252,0.88) 50%,rgba(174,208,246,0.86) 100%);
    -webkit-backdrop-filter:blur(2px);
    backdrop-filter:blur(2px);
    border:1px solid #1f4f86;
    border-top-color:#f2f9ff;
    border-radius:6px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),
               inset 0 -2px 0 rgba(60,90,130,0.22),
               0 2px 0 #1a4476,
               0 6px 11px rgba(3,18,45,0.55);
  }
  .section h2{
    margin:0 0 4px;
    font-size:15.2px;
    font-weight:800;
    letter-spacing:-0.2px;
    color:#071d3a;
    -webkit-text-stroke:0.4px #071d3a;
    text-shadow:none;
  }
  .links{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
  }
  a.link{
    display:inline-block;
    padding:3px 8px;
    border:1px solid #3a0a18;
    border-radius:5px;
    background:linear-gradient(180deg,rgba(255,255,255,0.30) 0%,rgba(255,255,255,0.08) 48%,rgba(255,255,255,0) 52%),
               linear-gradient(115deg,#c0566f 0%,#8c2c47 38%,#611a2f 70%,#3f0f1e 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.38),
               inset 0 -1px 0 rgba(0,0,0,0.25),
               0 1px 0 #3a0a18,
               0 3px 5px rgba(50,8,22,0.45);
    color:#ffffff;
    font-size:11.6px;
    font-weight:700;
    text-decoration:none;
    text-shadow:0 1px 1px rgba(0,0,0,0.45);
    white-space:nowrap;
    transition:transform .08s ease, box-shadow .08s ease, background .12s ease;
  }
  a.link:hover,a.link:focus{
    background:linear-gradient(180deg,#2f6aa3 0%,#1a4f86 55%,#123c68 100%);
    border-color:#0b2744;
    color:#ffffff;
    text-shadow:0 1px 1px rgba(0,0,0,0.45);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.3),
               0 1px 0 #0b2744,
               0 3px 6px rgba(6,28,56,0.45);
    outline:none;
  }
  a.link:active{
    transform:translateY(1px);
    box-shadow:inset 0 2px 3px rgba(0,0,0,0.35),
               0 0 0 #0b2744;
  }

  /* ----- 검색 영역 ----- */
  .search{ display:grid; gap:3px; padding-top:3px; padding-bottom:4px; }
  .search .kw{
    width:100%;
    min-width:0;
    font:inherit;
    font-size:16px;
    line-height:1.2;
    padding:3px 9px;
    color:#071d3a;
    background:rgba(255,255,255,0.92);
    border:1px solid #6f87a3;
    border-radius:5px;
    box-shadow:inset 0 2px 3px rgba(10,30,60,0.22),0 1px 0 rgba(255,255,255,0.9);
    outline:none;
    -webkit-appearance:none;
    appearance:none;
  }
  .search .kw::placeholder{ color:#5b6f86; }
  .search .kw:focus{ border-color:#74223a; box-shadow:inset 0 2px 3px rgba(10,30,60,0.22),0 0 0 2px rgba(116,34,58,0.35); }
  .search .pick{ display:flex; flex-wrap:wrap; gap:3px 8px; align-items:center; }
  .search label{ display:flex; align-items:center; gap:4px; font-size:11.6px; font-weight:800; color:#0b2547; }
  .search select{
    font:inherit;
    font-size:11.6px;
    font-weight:700;
    line-height:1.2;
    padding:1px 4px;
    max-width:170px;
    color:#071d3a;
    background:linear-gradient(180deg,#ffffff 0%,#dfe9f4 100%);
    border:1px solid #6f87a3;
    border-bottom-color:#3f648d;
    border-radius:5px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.95),0 1px 0 #3f648d,0 2px 4px rgba(8,36,70,0.28);
    outline:none;
  }
  .search select:focus{ border-color:#74223a; }
  .search button.reset{
    font:inherit;
    font-size:11.6px;
    font-weight:700;
    padding:1px 8px;
    color:#fff;
    background:linear-gradient(115deg,#8c2c47 0%,#611a2f 70%,#3f0f1e 100%);
    border:1px solid #3a0a18;
    border-radius:5px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.3),0 1px 0 #3a0a18,0 2px 4px rgba(50,8,22,0.4);
    text-shadow:0 1px 1px rgba(0,0,0,0.45);
    cursor:pointer;
  }
  .search button.reset:active{ transform:translateY(1px); box-shadow:inset 0 2px 3px rgba(0,0,0,0.35); }
  .search .count{ margin-left:auto; font-size:11.6px; font-weight:700; color:#0b2547; }
  .empty{ margin:0; font-size:13px; font-weight:700; color:#0b2547; }
  .hide{ display:none !important; }
  .preview-tag{ position:fixed; left:0; right:0; bottom:0; z-index:5; margin:0; padding:3px 8px; text-align:center; font-size:11.6px; font-weight:800; color:#fff; background:#9a1030; }
  /* 고정 항목: 금색 버튼 + 진한 글자 (일반 와인색과 구별) */
  a.link.pinned{
    color:#2b1700; text-shadow:0 1px 0 rgba(255,255,255,0.45); border-color:#7a4d00;
    background:linear-gradient(180deg,rgba(255,255,255,0.45) 0%,rgba(255,255,255,0.10) 48%,rgba(255,255,255,0) 52%),
               linear-gradient(115deg,#ffe58a 0%,#ffc63a 45%,#f0a500 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),inset 0 -1px 0 rgba(0,0,0,0.2),0 1px 0 #7a4d00,0 3px 5px rgba(50,30,0,0.4);
  }
  a.link.pinned::before{ content:"★"; margin-right:3px; color:#8c2c47; }
  a.link.pinned:hover,a.link.pinned:focus{ color:#fff; text-shadow:0 1px 1px rgba(0,0,0,0.45); }
  a.link.pinned:hover::before,a.link.pinned:focus::before{ color:#ffd966; }

  /* ----- 하위 항목(sub): 소제목 + 버튼 묶음 ----- */
  .sub{
    margin:5px 0 0;
    padding-top:5px;
    border-top:1px solid rgba(95,125,160,0.38);
  }
  .sub:first-of-type{ margin-top:2px; }
  .sub h3{
    display:inline-block;
    margin:0 0 4px;
    padding:1px 7px 1px 6px;
    font-size:12.5px;
    font-weight:800;
    letter-spacing:-0.1px;
    color:#0b2547;
    background:linear-gradient(180deg,#fffdf0 0%,#fff0b8 55%,#ffe38a 100%);
    border:1px solid #c9a23c;
    border-left:4px solid #74223a;
    border-radius:4px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.95),0 1px 0 #a98524,0 2px 3px rgba(60,40,5,0.28);
  }

  /* ----- 하단 안내문: 배경색 상자 없이, 글자 뒤에만 번지는 그라데이션 ----- */
  .foot{
    position:relative;
    z-index:0;
    align-self:flex-start;
    max-width:100%;
    margin-top:auto;
    padding-top:14px;
  }
  .foot::before{
    content:"";
    position:absolute;
    top:4px;right:-24px;bottom:-12px;left:-24px;
    z-index:-1;
    border-radius:28px;
    background:rgba(4,20,14,0.64);
    filter:blur(14px);
  }
  @media (max-width:560px){
    .foot::before{ left:-14px; right:-14px; }
  }
  .foot .notice{
    margin:0 0 2px;
    font-size:11.6px;
    font-weight:800;
    color:#ffffff;
    text-shadow:0 1px 3px rgba(0,0,0,0.70);
    word-break:keep-all;
    text-wrap:balance;
  }
  .foot .copyright{
    margin:0;
    font-size:11.6px;
    color:#eef3ee;
    text-shadow:0 1px 3px rgba(0,0,0,0.70);
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>

<div class="page">
  <div class="top">
    <main id="gate"></main>
  </div>
  <noscript>자바스크립트를 켜야 메뉴가 표시됩니다.</noscript>

  <footer class="foot">
    <p class="notice" id="fNotice">※ 고객상담시에는 반드시 시스템을 확인하시기 바랍니다.</p>
    <p class="copyright" id="fCopy">ⓒ2026. YOON HYUNCHUL ALL RIGHTS RESERVED.</p>
  </footer>
</div>

<script>
/* ===== 데이터는 kms_data.json 에 있습니다 =====
   직접 고치지 말고 관리화면(kms_admin.html)에서 수정·저장하세요.
   표시 규칙: 고정(pin) 항목이 항상 맨 앞 → 그 뒤는 sort:true 인 대분류 안에서만 가나다순, 아니면 입력 순서 */
const ko = function(a, b){ return a.localeCompare(b, "ko"); };
const norm = function(t){ return String(t).toLowerCase().replace(/\s+/g, ""); };
const normQ = function(t){ return norm(t).replace(/^#+/, ""); };   /* '#세금' 처럼 # 를 붙여도 검색됨 */

/* 고정 항목을 앞에 두고, auto 이면 나머지를 가나다순으로 */
function ordered(list, auto, key){
  const pins = list.filter(function(x){ return x.pin; });
  const rest = list.filter(function(x){ return !x.pin; });
  if (auto) rest.sort(function(x, y){ return ko(key(x), key(y)); });
  return pins.concat(rest);
}

const root = document.getElementById("gate");

function upA(t){ return String(t).replace(/[a-z]+/g, function(m){ return m.toUpperCase(); }); }

function start(data){
  /* 하단 문구·배경 사진 (관리화면에서 수정) */
  if (data.footer) {
    if (data.footer.notice) document.getElementById("fNotice").textContent = data.footer.notice;
    if (data.footer.copyright) document.getElementById("fCopy").textContent = upA(data.footer.copyright);
  }
  if (data.bg) document.documentElement.style.setProperty("--bg-img", 'url("' + data.bg + '")');
  if (typeof data.bgY === "number") document.documentElement.style.setProperty("--bg-y", data.bgY + "%");
  const model = [];   /* 검색에 쓰는 구조: 대분류 > 중분류 > 링크 */

  ordered(data.sections, false, function(s){ return s.title; }).forEach(function(sec){
    const box = document.createElement("section");
    box.className = "panel section";
    const h = document.createElement("h2");
    h.textContent = sec.title;
    box.appendChild(h);
    const secModel = { title: sec.title, box: box, subs: [] };

    ordered(sec.groups, sec.sort, function(g){ return g.title; }).forEach(function(g){
      const sub = document.createElement("div");
      sub.className = "sub";
      const h3 = document.createElement("h3");
      h3.textContent = g.title;
      sub.appendChild(h3);
      const row = document.createElement("div");
      row.className = "links";
      const store = [];
      ordered(g.links, sec.sort, function(l){ return l.label; }).forEach(function(item){
        const a = document.createElement("a");
        a.className = "link" + (item.pin ? " pinned" : "");
        a.href = item.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = item.label;
        if (item.tags && item.tags.length) a.title = item.tags.map(function(t){ return "#" + t; }).join(" ");
        row.appendChild(a);
        store.push({ el: a, label: item.label, tags: (item.tags || []).map(normQ) });
      });
      sub.appendChild(row);
      box.appendChild(sub);
      secModel.subs.push({ title: g.title, el: sub, links: store });
    });
    model.push(secModel);
  });

  /* ----- 검색 영역 (맨 위) ----- */
  const sp = document.createElement("section");
  sp.className = "panel search";
  sp.innerHTML =
    '<input id="kw" class="kw" type="search" placeholder="키워드·#해시태그 검색 (예: 국세, 안전, #공시)" autocomplete="off" aria-label="키워드 검색">' +
    '<div class="pick">' +
      '<label>대분류 <select id="s1" aria-label="대분류"></select></label>' +
      '<label>중분류 <select id="s2" aria-label="중분류"></select></label>' +
      '<button id="rs" class="reset" type="button">초기화</button>' +
      '<span id="cnt" class="count"></span>' +
    '</div>';
  root.innerHTML = "";
  root.appendChild(sp);
  model.forEach(function(m){ root.appendChild(m.box); });

  const empty = document.createElement("p");
  empty.className = "panel empty hide";
  empty.textContent = "검색 결과가 없습니다.";
  root.appendChild(empty);

  const kw = document.getElementById("kw");
  const s1 = document.getElementById("s1");
  const s2 = document.getElementById("s2");
  const cnt = document.getElementById("cnt");

  function opt(v, t){ const o = document.createElement("option"); o.value = v; o.textContent = t; return o; }

  s1.appendChild(opt("", "전체"));
  model.forEach(function(m, i){ s1.appendChild(opt(String(i), m.title)); });

  /* 중분류: 대분류를 고르면 그 하위항목만, 고르지 않으면 모든 중분류를 보여줌. 값은 "대분류번호|중분류번호" */
  function fillS2(){
    const prev = s2.value;
    s2.innerHTML = "";
    s2.appendChild(opt("", "전체"));
    model.forEach(function(m, mi){
      if (s1.value !== "" && Number(s1.value) !== mi) return;
      m.subs.forEach(function(sub, si){ s2.appendChild(opt(mi + "|" + si, sub.title)); });
    });
    const ok = Array.prototype.some.call(s2.options, function(o){ return o.value === prev; });
    s2.value = ok ? prev : "";
  }

  /* ----- 필터 적용 ----- */
  function apply(){
    const q = normQ(kw.value);
    const a = s1.value;
    const bp = s2.value === "" ? null : s2.value.split("|").map(Number);
    let shown = 0;

    model.forEach(function(m, mi){
      let secVisible = 0;
      const secOk = (a === "" || Number(a) === mi) && (bp === null || bp[0] === mi);
      m.subs.forEach(function(sub, si){
        const subOk = secOk && (bp === null || bp[1] === si);
        let subVisible = 0;
        sub.links.forEach(function(l){
          let ok = subOk;
          /* 키워드는 링크 이름과 해시태그만 검색 (대분류·중분류 이름은 제외) */
          if (ok && q !== "") ok = norm(l.label).indexOf(q) >= 0 || l.tags.some(function(t){ return t.indexOf(q) >= 0; });
          l.el.classList.toggle("hide", !ok);
          if (ok) subVisible++;
        });
        sub.el.classList.toggle("hide", subVisible === 0);
        secVisible += subVisible;
      });
      m.box.classList.toggle("hide", secVisible === 0);
      shown += secVisible;
    });

    empty.classList.toggle("hide", shown !== 0);
    cnt.textContent = shown + "개";
  }

  kw.addEventListener("input", apply);
  s1.addEventListener("change", function(){ fillS2(); apply(); });
  s2.addEventListener("change", apply);
  document.getElementById("rs").addEventListener("click", function(){
    kw.value = ""; s1.value = ""; fillS2(); s2.value = ""; apply();
  });

  /* 검색해도 화면 폭이 출렁이지 않도록, 처음 모든 항목이 보일 때의 폭을 고정 */
  function lockWidth(){
    root.style.width = "";
    root.style.width = root.offsetWidth + "px";
  }
  fillS2();
  apply();
  lockWidth();
  window.addEventListener("resize", lockWidth);
}

var pv = null;
if (/[?&]preview=1/.test(location.search)) {
  try { pv = JSON.parse(sessionStorage.getItem("kms_preview") || "null"); } catch(e){ pv = null; }
}
if (pv) {
  start(pv);
  const tag = document.createElement("p");
  tag.className = "preview-tag";
  tag.textContent = "미리보기 — 아직 저장되지 않은 관리화면의 편집 내용입니다";
  document.body.appendChild(tag);
} else if (window.KMS_DATA) {
  start(window.KMS_DATA);
} else {
  fetch("kms_data.json?t=" + Date.now(), { cache: "no-store" })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(start)
    .catch(function(){ root.innerHTML = '<p class="panel empty">데이터를 불러오지 못했습니다. 잠시 후 새로고침 해주세요.</p>'; });
}
</script>
</body>
</html>
