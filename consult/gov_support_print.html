<script>
(function(){
  var G=GS, $=function(i){return document.getElementById(i);}, esc=G.esc;
  G.load(); G.setTop(); G.setFoot(); setTimeout(G.hf,0); window.addEventListener("beforeprint",G.hf);
  var F=G.fromQS(location.search);
  $('rgwrap').innerHTML=G.REGION_HTML();
  $('flt').innerHTML=G.FILTER_HTML;
  var pt=(G.cfg.prtTitle||G.cfg.title||'정부지원·세제지원 현황');
  var asTxt='(기준일 : '+G.fmtD(G.asOf)+')';
  ['sht','fht'].forEach(function(i){$(i).textContent=pt;}); ['sha','fha'].forEach(function(i){$(i).textContent=asTxt;});
  $('foot').textContent=G.cfg.foot||''; $('disc').textContent=G.cfg.disc||'';
  $('back').href='gov_support.html'+(G.preview?'?preview=1':'');
  document.title=pt+' (기준일 '+G.fmtD(G.asOf)+')';

  function rowP(it){
    var tr=document.createElement('tr');
    var relCls=it.rel==='공식'?'b-ok':(it.rel==='보도'?'b-nw':'b-rf');
    var lvc='b-lv'+Math.max(0,G.LV.indexOf(it.lv));
    var reg=(it.r&&it.r!=='전국')?(it.r+(it.q?' '+it.q:'')):'전국';
    var c1='<span class="bd '+lvc+'">'+esc(it.lv)+'</span><div class="ln"><b>'+esc(reg)+'</b></div><div class="sm">'+esc(it.ag)+'</div>';
    var c2='<div class="nm">'+esc(it.n)+'</div>'+(it.law?'<div class="sm">근거: '+esc(it.law)+'</div>':'');
    var c3='<span class="lb">'+esc(it.cat)+'</span><div class="sm">'+esc((it.pf||[]).join(', '))+'</div>';
    var c4='<span class="lb">'+esc((it.tg||[]).join(', '))+'</span><div class="sm">업종: '+esc((it.ind||[]).join(', '))+'</div>';
    var c5=G.cv(it,'a',G.txt(it.a));
    var c6=((it.lt||[]).length?'<span class="ln"><span class="lb">유형:</span> '+esc(it.lt.join(', '))+'</span>':'')+G.cv(it,'lim',G.txt(it.lim));
    var c7=G.cv(it,'w',G.txt(it.w))+(it.d?'<span class="ln"><span class="lb">시기·기한:</span> '+esc(it.d)+'</span>':'');
    var c8='';
    if(it.ch) c8+='<div class="chb"><span class="bd b-ch">변경</span> '+esc(it.ch)+'</div>';
    if(it.fu) c8+='<div class="fub"><span class="bd b-fu">예정</span> '+esc(it.fu)+(it.fd?' <span class="sm">['+esc(it.fd)+']</span>':'')+'</div>';
    var c9='<span class="bd '+relCls+'">'+esc(it.rel)+'</span>'+(it.chk?'<span class="bd b-ck">확인필요</span>':'')+(it.end?'<span class="bd b-end">마감·종료 가능</span>':'');
    if(it.chk) c9+='<div class="ckr">'+esc(it.chk)+'</div>';
    c9+='<ol class="sr">'+(it.src||[]).map(function(s){var u=G.safeUrl(s[1]);return '<li>'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(s[0])+'</a>':esc(s[0]))+'</li>';}).join('')+'</ol><div class="sm">확인일 '+esc(G.fmtD(it.v))+'</div>';
    var cells=[c1,c2,c3,c4,c5,c6,c7,c8||'-',c9];
    tr.innerHTML=cells.map(function(c,i){return '<td class="'+(i===0?'c1':'')+(i===7&&!c8?' emp':'')+'">'+c+'</td>';}).join('');
    return tr;
  }

  function overview(list,act){
    var lv=G.LV.map(function(l){return esc(l)+' <b>'+list.filter(function(i){return i.lv===l;}).length+'</b>건';}).join(' / ');
    var h='<div class="ottl">개요 : 지원 종류 × 대상 기업 <span>총 '+list.length+'건 | 지급주체: '+lv+(act.length?' | <b>조건</b> '+esc(act.join(' · ')):'')+'</span></div>';
    h+=G.matrixLegend(list)+G.matrix(list,{});
    h+='<div class="ottl" style="margin-top:6px">주요 일정</div><div class="tlp">'+(G.timeline||[]).map(function(t){return '<span class="'+(t[2]==='p'?'p':'')+'"><b>'+esc(t[0])+'</b> '+esc(t[1])+'</span>';}).join('')+'</div>';
    return h;
  }

  function render(){
    var list=G.filter(F), tb=$('tb'); tb.innerHTML='';
    var act=[]; if(F.sido) act.push('지역 '+G.regionName(F)+(F.nc?' (중앙정부 제외)':' (중앙정부·전국 포함)'));
    var am=function(m){return m==='and'?'(AND)':'(OR)';}; if(F.q)act.push('검색어 '+F.q+am(F.qm)); if(F.lvs.length)act.push('주체 '+F.lvs.join('/')); if(F.lv)act.push('주체 입력 '+F.lv+am(F.lvm));
    if(F.tgs.length)act.push('대상 '+F.tgs.join('/')); if(F.tg)act.push('대상 입력 '+F.tg+am(F.tgm));
    if(F.lts.length)act.push('제한유형 '+F.lts.join('/')); if(F.lt)act.push('제한 입력 '+F.lt+am(F.ltm));
    if(F.cats.length)act.push('분류 '+F.cats.join('/')); if(F.pfs.length)act.push('형태 '+F.pfs.join('/')); if(F.rels.length)act.push('출처 '+F.rels.join('/'));
    if(F.chk)act.push('확인필요만'); if(F.hideEnd)act.push('마감 제외');
    var cols=['구분(지급주체·지역·소관)','지원·정책명','분류·형태','대상 기업','지원 내용','제한조건','신청·문의·시기','변경·예정','확인·출처'];
    $('th').innerHTML='<tr class="spc"><th colspan="9"></th></tr><tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr>';
    $('ovbox').innerHTML=overview(list,act);
    list.forEach(function(it){tb.appendChild(rowP(it));});
    if(!list.length) tb.innerHTML='<tr><td colspan="9" class="emp" style="padding:14px">조건에 맞는 항목이 없습니다.</td></tr>';
  }
  G.initFilterUI(F,render); render();
})();
</script>
<script id="popup-drag">
/* popup-drag: 팝업(모달·dialog·플로팅 패널) 헤더 영역을 끌어 이동 (마우스·터치 공통) */
(function () {
  if (window.__popupDrag) return;
  window.__popupDrag = 1;
  var INTER = 'input,textarea,select,button,a,label,option,summary,[contenteditable],[role=button]';
  var SKIP = /toast|copy|drawer|menu|tooltip|banner|navbar|fmtpanel|pd-skip/i;
  var NAME = /pop|modal|dlg|dialog|panel|sheet|layer/i;
  var moved = [], drag = null, lastDrag = 0, lastMove = 0;

  var st = document.createElement('style');
  st.textContent =
    'html.pd-can *:not(input):not(textarea):not(select):not(button):not(a):not(label){cursor:move!important}' +
    'html.pd-drag,html.pd-drag *{cursor:move!important;user-select:none!important;-webkit-user-select:none!important}';
  (document.head || document.documentElement).appendChild(st);

  function alpha(c) {
    var m = /rgba?\(([^)]+)\)/.exec(c || '');
    if (!m) return 0;
    var p = m[1].split(',');
    return p.length > 3 ? parseFloat(p[3]) : 1;
  }
  function nm(el) { return (el.id || '') + ' ' + (el.getAttribute('class') || ''); }

  function findPanel(t) {
    if (!t || !t.closest) return null;
    var d = t.closest('dialog');
    if (d) return d.open && !SKIP.test(nm(d)) ? d : null;
    var prev = null, el = t, vw = innerWidth, vh = innerHeight;
    while (el && el !== document.body && el !== document.documentElement) {
      var cs = getComputedStyle(el);
      if (cs.position === 'fixed') {
        var r = el.getBoundingClientRect();
        if (r.width >= vw * 0.9 && r.height >= vh * 0.9) {
          if (!prev || SKIP.test(nm(el))) return null;
          var ok = NAME.test(nm(el)) || el.getAttribute('role') === 'dialog' ||
            el.getAttribute('aria-modal') === 'true' ||
            (alpha(cs.backgroundColor) > 0 && alpha(cs.backgroundColor) < 1);
          if (!ok) return null;
          var pr = prev.getBoundingClientRect();
          if (pr.width >= r.width * 0.98 && pr.height >= r.height * 0.98) return null;
          return prev;
        }
        return NAME.test(nm(el)) && !SKIP.test(nm(el)) ? el : null;
      }
      prev = el;
      el = el.parentElement;
    }
    return null;
  }

  function isHandle(p, cx, cy, t) {
    if (t.closest(INTER)) return false;
    var r = p.getBoundingClientRect(), y = cy - r.top;
    if (cx < r.left || cx > r.right || y < 0 || y > r.height) return false;
    if (y <= 64) return true;
    return y <= 120 && !!t.closest('h1,h2,h3,h4,h5,header');
  }

  function tr(p) {
    var m = /(-?[\d.]+)px\s+(-?[\d.]+)px/.exec(p.style.translate || '');
    return m ? [parseFloat(m[1]), parseFloat(m[2])] : [0, 0];
  }

  function start(cx, cy, t) {
    var p = findPanel(t);
    if (!p || !isHandle(p, cx, cy, t)) return null;
    var o = tr(p);
    return { p: p, sx: cx, sy: cy, ox: o[0], oy: o[1], r: p.getBoundingClientRect(), moved: false };
  }

  function move(cx, cy) {
    var d = drag, dx = cx - d.sx, dy = cy - d.sy;
    if (!d.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
    if (!d.moved) {
      d.moved = true;
      document.documentElement.classList.add('pd-drag');
      if (moved.indexOf(d.p) < 0) moved.push(d.p);
    }
    dx = Math.max(40 - d.r.right, Math.min(innerWidth - 40 - d.r.left, dx));
    dy = Math.max(-d.r.top, Math.min(innerHeight - 40 - d.r.top, dy));
    d.p.style.translate = (d.ox + dx) + 'px ' + (d.oy + dy) + 'px';
  }

  function end() {
    if (!drag) return;
    if (drag.moved) lastDrag = Date.now();
    drag = null;
    document.documentElement.classList.remove('pd-drag');
  }

  window.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    var d = start(e.clientX, e.clientY, e.target);
    if (d) { drag = d; e.preventDefault(); }
  }, true);
  window.addEventListener('mousemove', function (e) {
    if (drag) { move(e.clientX, e.clientY); return; }
    var n = Date.now();
    if (n - lastMove < 80) return;
    lastMove = n;
    var p = findPanel(e.target);
    document.documentElement.classList.toggle('pd-can', !!(p && isHandle(p, e.clientX, e.clientY, e.target)));
  }, true);
  window.addEventListener('mouseup', end, true);
  window.addEventListener('click', function (e) {
    if (lastDrag && Date.now() - lastDrag < 350) { lastDrag = 0; e.stopPropagation(); e.preventDefault(); }
  }, true);

  window.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    var t = e.touches[0], d = start(t.clientX, t.clientY, e.target);
    if (d) { drag = d; e.preventDefault(); }
  }, { capture: true, passive: false });
  window.addEventListener('touchmove', function (e) {
    if (!drag) return;
    e.preventDefault();
    move(e.touches[0].clientX, e.touches[0].clientY);
  }, { capture: true, passive: false });
  window.addEventListener('touchend', end, true);
  window.addEventListener('touchcancel', end, true);

  /* 팝업이 닫히면 위치 초기화 */
  new MutationObserver(function () {
    if (!moved.length) return;
    moved = moved.filter(function (p) {
      if (p.getClientRects().length) return true;
      p.style.translate = '';
      return false;
    });
  }).observe(document.documentElement, {
    attributes: true, subtree: true, childList: true,
    attributeFilter: ['class', 'style', 'open', 'hidden']
  });
})();
</script>
